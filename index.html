function buildSession(muscles,log,profile){
  const stype=profile?.sportType||"kracht",epref=profile?.equipmentPref||"mixed",level=profile?.level||"beginner",goal=profile?.goal||"fitter",age=parseInt(profile?.age)||30;
  const diffs=LS.get("fitcoach_difficulty")||{};
  const machineEx=["Leg Press","Leg Extension","Leg Curl","Lat Pulldown","Seated Cable Row","Cable Fly","Triceps Pushdown","Face Pulls"];
  const dumbEx=["Incline Dumbbell Press","Lateral Raises","Hammer Curl","Incline Dumbbell Curl","Concentration Curl","Arnold Press"];
  const seniorAvoid=["Deadlift","Squat","Skull Crushers","Nordic Curl","Dragon Flag","Clean and Press","Thruster"];
  const exercises=[];
  muscles.forEach(muscle=>{
    const variants=ALL_WV[muscle]||WV[muscle]||WV["full body"];if(!variants)return;
    const prevCount=log.filter(e=>(e.targetMuscles||[]).includes(muscle)).length;
    const variant=variants[prevCount%variants.length]||variants[0];
    const last=log.find(e=>(e.targetMuscles||[]).includes(muscle));
    const lastMap={};if(last)last.exercises.forEach(e=>{lastMap[e.name]=e;});
    let filtered=[...variant];
    if(stype==="kracht"||stype==="gemixed"){if(epref==="machines"){const m=variant.filter(ex=>machineEx.includes(ex.name));if(m.length>=2)filtered=m;}else if(epref==="dumbbells"){const d=variant.filter(ex=>dumbEx.includes(ex.name));if(d.length>=2)filtered=d;}}
    if(age>=60){filtered=filtered.filter(ex=>!seniorAvoid.includes(ex.name));}
    if(level==="beginner"||age>=65){const compounds=filtered.filter(e=>e.compound).slice(0,2);const isolatie=filtered.filter(e=>!e.compound).slice(0,2);filtered=[...compounds,...isolatie];}
    else if(level==="gemiddeld"){const compounds=filtered.filter(e=>e.compound).slice(0,2);const isolatie=filtered.filter(e=>!e.compound).slice(0,3);filtered=[...compounds,...isolatie];}
    else{const compounds=filtered.filter(e=>e.compound).slice(0,2);const isolatie=filtered.filter(e=>!e.compound).slice(0,4);filtered=[...compounds,...isolatie];}
    filtered.forEach(ex=>{
      if(!exercises.find(e=>e.name===ex.name)){
        const db=EX_DB[ex.name]||{},unit=db.unit||"kg",prevEx=lastMap[ex.name];
        let weights=prevEx&&prevEx.weights&&prevEx.weights.some(w=>w>0)?[...prevEx.weights]:[...ex.weights];
        if(goal==="spiermassa"&&prevEx&&stype==="kracht"){const maxPrev=Math.max(0,...prevEx.weights.filter(w=>w>0));if(maxPrev>0){const increment=maxPrev<20?1.25:maxPrev<50?2.5:5;weights=weights.map(w=>w>0?Math.round((w+increment)/2.5)*2.5:w);}}
        if(age>=60){weights=weights.map(w=>w>0?Math.round(w*0.7/2.5)*2.5:w);}
        const diff=diffs[muscle];
        if(diff==="makkelijk"){weights=weights.map(w=>w>0?Math.round((w*1.075)/2.5)*2.5:w);}
        if(diff==="zwaar"){weights=weights.map(w=>w>0?Math.round((w*0.9)/2.5)*2.5:w);}
        const prevReps=prevEx?.repsPerSet||null;
        const defaultReps=parseInt((ex.reps||db?.reps||"10").toString().split("-")[0])||10;
        const repsArr=prevReps||weights.map(()=>defaultReps);
        exercises.push({...ex,weights,repsPerSet:repsArr,note:"",saved:false,unit,info:db.info||"",yt:db.yt||"",prevWeights:prevEx?.weights||null,prevNote:prevEx?.note||"",repsRange:ex.reps||db.reps||"8-12"});
      }
    });
  });
  const gymMin=parseInt(profile?.gymMinuten)||60;
  const maxEx=gymMin<=45?4:gymMin<=60?6:gymMin<=75?7:9;
  const adjusted=adjustForGoal(exercises.slice(0,maxEx),goal,stype);
  if(age>=60){adjusted.forEach(e=>{if(!e.restSecs)e.restSecs=90;});}
  if(goal==="afvallen"&&(stype==="kracht"||stype==="gemixed")){const cf=CARDIO_FINISH[Math.floor(Math.random()*CARDIO_FINISH.length)];const db=EX_DB[cf.name]||{};adjusted.push({...cf,note:"",saved:false,unit:cf.unit||"sec",info:db.info||"",yt:db.yt||"",prevWeights:null,prevNote:"",isCardioFinish:true});}
  return adjusted;
}

function AuthScreen({onAuth,lang}){ const T=TRANSLATIONS[lang]||TRANSLATIONS.nl;

    setErr("");setOk("");

      if(pw.length<6){setErr("Wachtwoord moet minimaal 6 tekens zijn.");return;}

    }

      <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,rgba(0,0,0,0.2) 0%,rgba(13,13,13,0.97) 65%,#0D0D0D 100%)"}}/>

        <div style={{fontSize:14,color:"rgba(255,255,255,0.45)"}}>{mode==="login"?"Log in om verder te gaan met Roan":"Maak gratis een account aan"}</div>

        {step===5&&<>
          <StapHeader nr={5} titel={"Jouw niveau"} sub="Roan past de oefeningen, gewichten en intensiteit hierop aan."/>

              {v:"beginner",l:"Beginner",d:"< 6 maanden",e:"🌱"},
              {v:"gemiddeld",l:"Gemiddeld",d:"6m – 2 jaar",e:"📈"},

                <button key={e.v} onClick={()=>u("equipmentPref",e.v)} style={{padding:"12px 16px",borderRadius:12,border:"1.5px solid "+(p.equipmentPref===e.v?LIME:BORDER),background:p.equipmentPref===e.v?"rgba(200,241,56,0.07)":"#141414",textAlign:"left",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><div style={{fontSize:13,fontWeight:700,color:p.equipmentPref===e.v?LIME:TEXT,marginBottom:2}}>{e.l}</div><div style={{fontSize:11,color:isDark?"#555":"#888"}}>{e.d}</div></div>
                  {p.equipmentPref===e.v&&<div style={{color:LIME,fontSize:18}}>✓</div>}

            </div>
          </>}
          {Volgende(6)}
        </>}
        {step===6&&<>
          <StapHeader nr={6} titel="Wanneer train je?" sub="Roan plant je schema op je trainingsdagen en geeft rustdagtips op de rest."/>
          <RoanTip tekst="Op trainingsdagen zal ik je motiveren en een schema klaarzetten. Op rustdagen geef ik herstel- en voedingstips."/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:12}}>
            {[{k:"ma",l:"Ma"},{k:"di",l:"Di"},{k:"wo",l:"Wo"},{k:"do",l:"Do"},{k:"vr",l:"Vr"},{k:"za",l:"Za"},{k:"zo",l:"Zo"}].map(d=>{
              const sel=(p.trainDayNames||[]).includes(d.k);
              return <button key={d.k} onClick={()=>{const cur=p.trainDayNames||[];u("trainDayNames",sel?cur.filter(x=>x!==d.k):[...cur,d.k]);}} style={{padding:"12px 4px",borderRadius:10,border:"1px solid "+(sel?LIME:BORDER),background:sel?"rgba(200,241,56,0.1)":"#111",color:sel?LIME:isDark?"#444":"#666",fontSize:12,fontWeight:900,cursor:"pointer"}}>{d.l}</button>;
            })}
          </div>
          <div style={{fontSize:12,color:isDark?"#555":"#888",marginBottom:20,textAlign:"center"}}>
            {(p.trainDayNames||[]).length} dag{(p.trainDayNames||[]).length!==1?"en":""} geselecteerd

          </div>
          <div style={{fontSize:11,color:isDark?"#444":"#888",marginBottom:8}}>Snel kiezen:</div>
          <div style={{display:"flex",gap:8,marginBottom:4}}>
            {[
              {l:"3x/week",d:["ma","wo","vr"]},
              {l:"4x/week",d:["ma","di","do","vr"]},
              {l:"5x/week",d:["ma","di","wo","do","vr"]},
            ].map(s=>(
              <button key={s.l} onClick={()=>u("trainDayNames",s.d)} style={{flex:1,padding:"8px 4px",borderRadius:10,border:"1px solid "+BORDER,background:isDark?"#111":CARD_BG,color:isDark?"#555":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>{s.l}</button>
            ))}
          </div>
          {Volgende(7,!(p.trainDayNames||[]).length)}
        </>}
        {step===7&&<>
          <StapHeader nr={7} titel="Voeding & fase" sub="Roan genereert een weekmenu en geeft voedingsadvies op basis van jouw voorkeuren."/>

          <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:10}}>Calorietarget</div>

              {v:"licht cutten",l:"Afvallen",d:"~300 kcal tekort per dag",c:"#ef4444",e:"↘️"},

              {v:"licht bulken",l:"Lean bulk",d:"~300 kcal surplus",c:"#34d399",e:"↗️"},

              <button key={f.v} onClick={()=>u("fase",f.v)} style={{padding:"12px 14px",borderRadius:12,border:"1.5px solid "+(p.fase===f.v?f.c:BORDER),background:p.fase===f.v?f.c+"18":"#141414",cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontSize:13,fontWeight:700,color:p.fase===f.v?f.c:TEXT,marginBottom:2}}>{f.e} {f.l}</div><div style={{fontSize:11,color:isDark?"#555":"#888"}}>{f.d}</div></div>

          </div>
          <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>Voorkeuren (optioneel)</div>

          <input value={p.voedingDislikes} onChange={e=>u("voedingDislikes",e.target.value)} placeholder={T.watNiet} style={{...inp,marginBottom:12}}/>
          <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>Dieet</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>
            {["Geen","Vegetarisch","Vegan","Lactosevrij","Glutenvrij","Halal"].map(d=>(
              <button key={d} onClick={()=>u("voedingDiet",d==="Geen"?"":d)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid "+((p.voedingDiet===d||(d==="Geen"&&!p.voedingDiet))?"#fff":BORDER),background:(p.voedingDiet===d||(d==="Geen"&&!p.voedingDiet))?"rgba(255,255,255,0.06)":"#111",color:(p.voedingDiet===d||(d==="Geen"&&!p.voedingDiet))?TEXT:isDark?"#444":"#666",fontSize:11,fontWeight:700,cursor:"pointer"}}>{d}</button>
            ))}
          </div>
          {Volgende(8)}
        </>}
        {step===8&&<>
          <StapHeader nr={8} titel="Coaching stijl" sub="Hoe actief wil je dat Roan je begeleidt?"/>

              {v:"weinig",l:"Zelfstandig",d:"Roan is op de achtergrond. Trainingsschemas zonder constante feedback.",icon:""},

            ].map(c=>(
              <button key={c.v} onClick={()=>u("coachLevel",c.v)} style={{padding:"16px 18px",borderRadius:14,border:"1.5px solid "+(p.coachLevel===c.v?ORANGE:BORDER),background:p.coachLevel===c.v?"rgba(255,107,43,0.07)":"#141414",textAlign:"left",cursor:"pointer",display:"flex",gap:14,alignItems:"flex-start"}}>
                <div style={{fontSize:28,flexShrink:0}}>{c.icon}</div>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:p.coachLevel===c.v?ORANGE:TEXT,marginBottom:4}}>{c.l}</div>
                  <div style={{fontSize:11,color:isDark?"#555":"#888",lineHeight:1.5}}>{c.d}</div>
                </div>
                {p.coachLevel===c.v&&<div style={{marginLeft:"auto",color:ORANGE,fontSize:18,flexShrink:0}}>✓</div>}
              </button>
            ))}
          </div>
          {Volgende(9)}
        </>}
        {step===9&&<>
          <StapHeader nr={9} titel={T.roanBerekent} sub={"Op basis van jouw gegevens stelt Roan alles in."}/>
          {(()=>{
            const h=parseFloat(p.height)/100||1.75;
            const w=parseFloat(p.weight)||75;
            const age=parseInt(p.age)||25;
            const bmr=p.gender==="vrouw"?447.6+(9.25*w)+(3.1*(parseFloat(p.height)||165))-(4.33*age):88.36+(13.4*w)+(4.8*(parseFloat(p.height)||175))-(5.7*age);
            const tdee=Math.round(bmr*1.55);
            const bmiLow=p.gender==="man"?20:18.5;
            const bmiHigh=p.gender==="man"?27:24.9;
            const idealLow=Math.round(bmiLow*h*h);
            const idealHigh=Math.round(bmiHigh*h*h);
            const bmi=p.height&&p.weight?((w/h/h).toFixed(1)):"–";
            const eiwitDoel=Math.round(w*2);
            const faseObj=FASE_OPTIES.find(f=>f.v===p.fase)||FASE_OPTIES[2];
            const kcalDoel=Math.round(w*faseObj.mul);
            return(
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                {[
                  {l:"BMR",v:Math.round(bmr)+" kcal",sub:"Calorieën in rust",c:TEXT},
                  {l:"TDEE",v:tdee+" kcal",sub:"Dagelijkse verbranding",c:TEXT},
                  {l:T.calorieDoel,v:kcalDoel+" kcal",sub:"Op basis van jouw fase",c:LIME},
                  {l:T.eiwitDoel,v:eiwitDoel+"g",sub:"Per dag voor spiergroei",c:"#60a5fa"},
                  {l:"BMI",v:bmi,sub:"Minder nauwkeurig voor sporters",c:TEXT},
                  {l:"Ideaal gewicht",v:idealLow+"-"+idealHigh+" kg",sub:p.gender==="man"?"Atletisch bereik man":"Gezond bereik vrouw",c:TEXT},
                ].map(s=>(
                  <div key={s.l} style={{background:isDark?"#111":"#F0F0E8",borderRadius:12,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:13,fontWeight:700,color:TEXT}}>{s.l}</div><div style={{fontSize:10,color:isDark?"#444":"#888"}}>{s.sub}</div></div>
                    <div style={{fontSize:20,fontWeight:900,color:s.c}}>{s.v}</div>
                  </div>
                ))}
              </div>
            );
          })()}
          {Volgende(10)}
        </>}
        {step===10&&<>
          <div style={{textAlign:"center",marginBottom:24}}>
            <FinnImg size={120} emotion="victory"/>
            <div style={{fontSize:28,fontWeight:900,color:TEXT,marginTop:8,marginBottom:6}}>Klaar om te starten!</div>

          </div>
          <div style={{background:isDark?"#111":"#F0F0E8",borderRadius:16,padding:14,marginBottom:20}}>
            <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:10}}>Jouw profiel</div>

              {l:"Naam",v:p.name+(p.age?", "+p.age+" jaar":"")},
              {l:"Doel",v:p.goal+(p.sportType==="cardio"?" — "+{"k5":"5km","k10":"10km","half":"Halve marathon","conditie":"Conditie"}[p.loopDoel||"k5"]:"")},
              {l:"Sport",v:{kracht:"Kracht",calisthenics:"Calisthenics",hiit:"HIIT",cardio:"Hardlopen",gemixed:"Gemixed"}[p.sportType]||p.sportType},
              {l:"Niveau",v:{beginner:"Beginner",gemiddeld:"Gemiddeld",gevorderd:"Gevorderd"}[p.level]},
              {l:"Trainingsdagen",v:(p.trainDayNames||[]).join(", ")},
              {l:lang==="en"?"Phase":"Fase",v:p.fase||"Onderhoud"},
              {l:"Coaching",v:{weinig:"Zelfstandig",regelmatig:"Regelmatig",personal:"Personal trainer"}[p.coachLevel]},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",paddingBottom:8,marginBottom:8,borderBottom:"1px solid "+(isDark?"#1C1C1C":"#E0E0D8")}}>
                <div style={{fontSize:12,color:isDark?"#444":"#888"}}>{r.l}</div>
                <div style={{fontSize:12,color:TEXT,fontWeight:600,textTransform:"capitalize",maxWidth:"60%",textAlign:"right"}}>{r.v}</div>
              </div>
            ))}
          </div>
          <button onClick={()=>onComplete({...p,foodPrefs:{likes:p.voedingLikes,dislikes:p.voedingDislikes,diet:p.voedingDiet}})} style={{width:"100%",padding:18,borderRadius:16,border:"none",background:LIME,color:"#000",fontSize:16,fontWeight:900,cursor:"pointer",marginBottom:8}}>Start met Roan 🚀</button>
          <button onClick={()=>setStep(9)} style={{width:"100%",padding:12,borderRadius:14,border:"1px solid "+BORDER,background:"none",color:isDark?"#555":"#888",fontSize:13,cursor:"pointer"}}>{lang==="en"?"← Back":"← Terug"}</button>
        </>}

      </div>
    </div>
  );
}

function SettingsModal({profile,onSave,onClose,onLogout,theme,setTheme,lang,setLang,sbUser,isPro,onUpgrade}){ const T=TRANSLATIONS[lang]||TRANSLATIONS.nl;

        <input style={{...inp,margin:0}} type="number" placeholder={"Lengte (cm)"} value={p.height||""} onChange={e=>u("height",e.target.value)}/>

      <div style={{...S.lbl,marginBottom:8,color:txt3}}>{T.geslachtLabel}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
        {[{v:"man",l:"Man"},{v:"vrouw",l:"Vrouw"},{v:"ander",l:"Anders"}].map(g=>(

      </div>

            <div style={{marginBottom:16}}>

function calcStreak(log){
  if(!log||!log.length)return 0;
  let streak=0,check=new Date(TODAY);
  const logDates=new Set(log.map(e=>e.date));
  for(let i=0;i<60;i++){
    const key=fmtDate(check);
    if(logDates.has(key)){streak++;}
    else{
      // Vandaag niet getraind is OK (dag is nog niet voorbij)
      if(i===0){check=new Date(check.getTime()-86400000);continue;}
      break;
    }
    check=new Date(check.getTime()-86400000);
  }
  return streak;
}

function updatePRs(prData,exercises){
  const updated={...prData};
  exercises.forEach(ex=>{
    if(!ex.name||!ex.weights||!ex.unit)return;
    const maxW=Math.max(0,...ex.weights.filter(w=>w>0));
    if(maxW<=0)return;
    const key=ex.name;
    if(!updated[key]||maxW>updated[key].weight){
      updated[key]={weight:maxW,unit:ex.unit,date:TODAY_KEY};
    }
  });
  return updated;
}

function ChallengeBlok({T,setTab,profile}){
  const [actief,setActief]=useState(()=>LS.get("fitcoach_challenge_actief")||null);
  const [voortgang,setVoortgang]=useState(()=>LS.get("fitcoach_challenge_voortgang")||{});
  const [toonKiezen,setToonKiezen]=useState(false);
  const [toonDetail,setToonDetail]=useState(false);

  const challenge=actief?CHALLENGES.find(c=>c.id===actief):null;
  const prog=voortgang[actief]||[];
  const vandaagDag=challenge?Math.min(challenge.dagen,prog.length+1):1;
  const vandaagSessie=challenge?.schema?.find(s=>s.dag===vandaagDag);
  const pct=challenge?Math.round((prog.length/challenge.dagen)*100):0;

  function startChallenge(id){
    setActief(id);LS.set("fitcoach_challenge_actief",id);
    setVoortgang(v=>({...v,[id]:[]}));LS.set("fitcoach_challenge_voortgang",{...voortgang,[id]:[]});
    setToonKiezen(false);
  }
  function dagAfvinken(){
    if(!actief)return;
    const nieuw=[...(voortgang[actief]||[]),{dag:vandaagDag,datum:TODAY_KEY}];
    const bijgewerkt={...voortgang,[actief]:nieuw};
    setVoortgang(bijgewerkt);LS.set("fitcoach_challenge_voortgang",bijgewerkt);
    if(vandaagSessie?.finale){
      setTimeout(()=>alert("🎉 Challenge voltooid! Gefeliciteerd "+profile?.name+"!"),300);
    }
  }
  function stopChallenge(){
    if(window.confirm(lang==="en"?"Stop challenge? Progress is saved.":lang==="de"?"Challenge stoppen? Fortschritt bleibt erhalten.":"Challenge stoppen? Voortgang blijft bewaard.")){setActief(null);LS.set("fitcoach_challenge_actief",null);}
  }

  const vandaagKlaar=prog.some(p=>p.datum===TODAY_KEY);

  if(toonKiezen)return(
    <div style={{...makeS(CARD_BG,BORDER,TEXT3).card,padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:900,color:TEXT}}>Kies een challenge</div>
        <button onClick={()=>setToonKiezen(false)} style={{background:"none",border:"none",color:isDark?"#555":"#888",fontSize:20,cursor:"pointer",lineHeight:1}}>×</button>
      </div>
      {CHALLENGES.map(c=>(
        <div key={c.id} style={{border:"1px solid "+(isDark?"#1C1C1C":"#E0E0D8"),borderRadius:12,padding:14,marginBottom:8,cursor:"pointer"}} onClick={()=>startChallenge(c.id)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                <span style={{fontSize:20}}>{c.icon}</span>
                <span style={{fontSize:14,fontWeight:800,color:c.kleur}}>{c.titel}</span>
                <span style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:600}}>{c.dagen} dagen</span>
              </div>
              <div style={{fontSize:11,color:isDark?"#555":"#888",lineHeight:1.5}}>{c.beschrijving}</div>
            </div>
            <div style={{padding:"6px 12px",borderRadius:99,background:c.kleur,color:"#000",fontSize:11,fontWeight:800,marginLeft:10,flexShrink:0,alignSelf:"center"}}>Start</div>
          </div>
          {voortgang[c.id]?.length>0&&(
            <div style={{marginTop:8,fontSize:10,color:c.kleur,fontWeight:700}}>
              {voortgang[c.id].length}/{c.dagen} dagen voltooid
            </div>
          )}
        </div>
      ))}
    </div>
  );

  if(!challenge)return(
    <div style={{...makeS(CARD_BG,BORDER,TEXT3).card,padding:16,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div>
        <div style={{fontSize:13,fontWeight:800,color:TEXT,marginBottom:2}}>🏆 Challenges</div>
        <div style={{fontSize:11,color:isDark?"#555":"#888"}}>Geen actieve challenge</div>
      </div>
      <button onClick={()=>setToonKiezen(true)} style={{padding:"8px 16px",borderRadius:99,border:"none",background:LIME,color:"#000",fontSize:12,fontWeight:800,cursor:"pointer"}}>Kies challenge</button>
    </div>
  );

  return(
    <div style={{...makeS(CARD_BG,BORDER,TEXT3).card,padding:16,marginBottom:14,border:"1px solid "+challenge.kleur+"33"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:22}}>{challenge.icon}</span>
          <div>
            <div style={{fontSize:13,fontWeight:900,color:challenge.kleur}}>{challenge.titel}</div>
            <div style={{fontSize:10,color:isDark?"#444":"#888"}}>Dag {Math.min(vandaagDag,challenge.dagen)} van {challenge.dagen}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setToonKiezen(true)} style={{padding:"4px 10px",borderRadius:8,border:"1px solid "+(isDark?"#333":"#D0D0C8"),background:"none",color:isDark?"#555":"#888",fontSize:10,cursor:"pointer"}}>Wissel</button>
          <button onClick={stopChallenge} style={{padding:"4px 10px",borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"none",color:"#ef4444",fontSize:10,cursor:"pointer"}}>Stop</button>
        </div>
      </div>
      <div style={{background:isDark?"#111":"#E8E8E0",borderRadius:99,height:6,overflow:"hidden",marginBottom:6}}>
        <div style={{width:pct+"%",height:6,background:challenge.kleur,borderRadius:99,transition:"width .5s ease"}}/>
      </div>
      <div style={{fontSize:10,color:isDark?"#444":"#888",marginBottom:12}}>{pct}% voltooid · nog {challenge.dagen-prog.length} dagen</div>
      {prog.length>=challenge.dagen?(
        <div style={{textAlign:"center",padding:"12px 0"}}>
          <div style={{fontSize:28,marginBottom:6}}>🎉</div>
          <div style={{fontSize:14,fontWeight:900,color:challenge.kleur}}>Challenge voltooid!</div>
        </div>
      ):vandaagKlaar?(
        <div style={{display:"flex",alignItems:"center",gap:10,background:challenge.kleur+"18",borderRadius:10,padding:"10px 14px"}}>
          <div style={{fontSize:20}}>✅</div>
          <div><div style={{fontSize:12,fontWeight:700,color:challenge.kleur}}>Vandaag klaar!</div><div style={{fontSize:10,color:isDark?"#555":"#888"}}>Kom morgen terug voor dag {vandaagDag+1}</div></div>
        </div>
      ):vandaagSessie?.rust?(
        <div style={{display:"flex",alignItems:"center",gap:10,background:isDark?"#111":"#F0F0E8",borderRadius:10,padding:"10px 14px"}}>
          <div style={{fontSize:20}}>😴</div>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:TEXT}}>Rust dag</div>
            <div style={{fontSize:10,color:isDark?"#555":"#888"}}>{vandaagSessie.tip}</div>
          </div>
          <button onClick={dagAfvinken} style={{padding:"6px 12px",borderRadius:8,border:"none",background:isDark?"#1C1C1C":"#E0E0D8",color:isDark?"#666":"#888",fontSize:10,fontWeight:700,cursor:"pointer"}}>Afvinken</button>
        </div>
      ):(
        <div>
          <div style={{background:isDark?"#111":"#F0F0E8",borderRadius:12,padding:14,marginBottom:10}}>
            <div style={{fontSize:10,color:challenge.kleur,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Dag {vandaagDag}</div>
            <div style={{fontSize:16,fontWeight:900,color:TEXT,marginBottom:4}}>{vandaagSessie?.oefening}</div>
            <div style={{fontSize:13,color:isDark?"#888":"#666"}}>
              {vandaagSessie?.sets}× {vandaagSessie?.reps}
              {vandaagSessie?.rust?<span style={{color:isDark?"#444":"#888"}}> · {vandaagSessie.rust}s rust</span>:null}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setTab(T.training);}} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid "+challenge.kleur,background:"none",color:challenge.kleur,fontSize:12,fontWeight:700,cursor:"pointer"}}>Naar training →</button>
            <button onClick={dagAfvinken} style={{flex:1,padding:"10px",borderRadius:10,border:"none",background:challenge.kleur,color:vandaagSessie?.finale?"#fff":"#000",fontSize:12,fontWeight:800,cursor:"pointer"}}>{vandaagSessie?.finale?"🎉 Finish!":"✓ Klaar"}</button>
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:4,marginTop:12}}>
        {Array.from({length:7},(_,i)=>{
          const dagNr=Math.max(1,vandaagDag-6+i);
          const gedaan=prog.some(p=>p.dag===dagNr);
          const isVandaag=dagNr===vandaagDag;
          const sessie=challenge.schema.find(s=>s.dag===dagNr);
          return(
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{width:"100%",aspectRatio:"1",borderRadius:6,background:gedaan?challenge.kleur+"33":isVandaag?challenge.kleur+"18":isDark?"#111":"#F0F0E8",border:"1px solid "+(gedaan?challenge.kleur:isVandaag?challenge.kleur+"88":isDark?"#1C1C1C":"#E0E0D8"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:gedaan?challenge.kleur:isVandaag?TEXT:isDark?"#333":"#aaa"}}>
                {gedaan?"✓":sessie?.rust?"·":dagNr}
              </div>
              <div style={{fontSize:7,color:isDark?"#333":"#aaa",marginTop:2}}>{dagNr}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SchemaOpMaat({profile,log,onClose,setTab,T,lang}){
  const [stap,setStap]=useState(1);
  const [antwoorden,setAntwoorden]=useState({

  const [laden,setLaden]=useState(false);
  const u=(k,v)=>setAntwoorden(p=>({...p,[k]:v}));

  async function genereer(){
    setLaden(true);
    const dagNamen=antwoorden.beschikbareDagen.join(", ");
    const ctx=`Naam: ${profile?.name}, doel: ${profile?.goal}, sport: ${profile?.sportType}, niveau: ${profile?.level}, gewicht: ${profile?.weight}kg, leeftijd: ${profile?.age} jaar, fase: ${profile?.fase||"onderhoud"}, trainingslocatie: ${antwoorden.locatie}. Laatste trainingen: ${log.slice(0,3).map(e=>e.workout).join(", ")||"geen"}`;
    const prompt=`Maak een concreet weekschema voor ${profile?.name} op basis van: ${ctx}. Extra wensen: focus op ${antwoorden.focus||"algemeen"}, ${antwoorden.duur} minuten per sessie, intensiteit: ${antwoorden.intensiteit}, trainingsdagen: ${dagNamen}. ${antwoorden.extras?'Extra: '+antwoorden.extras:''}

Geef een schema per trainingsdag. Wees specifiek: noem oefeningen, sets en reps. Houd het beknopt en praktisch. Max 300 woorden. Respond in: ${"Dutch"}.`;
    const txt=await ai(prompt);
    setSchema(txt);
    LS.set("fitcoach_last_schema",{schema:txt,antwoorden,datum:new Date().toLocaleDateString("nl")});
    setLaden(false);
  }

  const inp={width:"100%",padding:"12px 14px",borderRadius:12,border:"1px solid "+BORDER,background:isDark?"#111":CARD_BG,color:TEXT,fontSize:13,outline:"none",marginBottom:10,boxSizing:"border-box"};

        </div>

function CardioTimer({ex,ei,onDone,profile,lang="nl",isDark,LIME,ORANGE,TEXT,CARD_BG,BORDER,BG}){
  const T=TRANSLATIONS[lang]||TRANSLATIONS.nl;
  const [running,setRunning]=React.useState(false);
  const [elapsed,setElapsed]=React.useState(0);
  const [incline,setIncline]=React.useState(0);
  const [tempo,setTempo]=React.useState(0); // 0=geen, 1=rustig, 2=normaal, 3=stevig, 4=hard
  const [done,setDone]=React.useState(false);
  const intervalRef=React.useRef(null);
  const startRef=React.useRef(null);

  React.useEffect(()=>{
    if(running){
      startRef.current=Date.now()-elapsed*1000;
      intervalRef.current=setInterval(()=>{
        setElapsed(Math.floor((Date.now()-startRef.current)/1000));
      },1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return ()=>clearInterval(intervalRef.current);
  },[running]);

  const fmtTime=(s)=>{
    const m=Math.floor(s/60),sec=s%60;
    return `${m}:${sec.toString().padStart(2,'0')}`;
  };

  const tempoLabels=lang==="en"
    ?["–","Easy","Moderate","Brisk","Fast"]
    :lang==="de"
    ?["–","Leicht","Moderat","Zügig","Schnell"]
    :["–","Rustig","Normaal","Stevig","Hard"];

  const tempoMET=[0,2.5,3.5,4.5,6.0];
  const weight=profile?.weight||75;
  const metVal=tempoMET[tempo]||(ex.name==="Wandelen"?3.5:5.0);
  const kcal=Math.round((elapsed/3600)*metVal*weight);

  if(done){
    return(
      <div style={{padding:16,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:8}}>✓</div>
        <div style={{fontSize:22,fontWeight:900,color:LIME,marginBottom:4}}>{fmtTime(elapsed)}</div>
        <div style={{fontSize:13,color:isDark?"#555":"#888",marginBottom:16}}>{kcal} kcal</div>
        <button onClick={()=>{onDone({elapsed,kcal,incline,tempo});}} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:LIME,color:"#000",fontSize:14,fontWeight:900,cursor:"pointer"}}>
          {"Opslaan"}
        </button>
      </div>
    );
  }

  return(
    <div style={{padding:"16px 0"}}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:56,fontWeight:900,color:running?LIME:TEXT,letterSpacing:-2,fontVariantNumeric:"tabular-nums",fontFamily:"monospace"}}>
          {fmtTime(elapsed)}
        </div>
        <div style={{fontSize:12,color:isDark?"#444":"#888",marginTop:4}}>
          {kcal} kcal · {tempo>0?tempoLabels[tempo]:("Geen tempo")}
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <button onClick={()=>setRunning(r=>!r)} style={{flex:1,padding:16,borderRadius:14,border:"none",background:running?"rgba(239,68,68,0.15)":LIME,color:running?"#ef4444":"#000",fontSize:16,fontWeight:900,cursor:"pointer",border:running?"1px solid rgba(239,68,68,0.3)":"none"}}>
          {running?(lang==="en"?"⏸ Pause":"⏸ Pauze"):(elapsed===0?("▶ Start"):("▶ Hervat"))}
        </button>
        {elapsed>0&&<button onClick={()=>{setRunning(false);setDone(true);}} style={{flex:1,padding:16,borderRadius:14,border:`1px solid ${LIME}`,background:"none",color:LIME,fontSize:14,fontWeight:900,cursor:"pointer"}}>
          {lang==="en"?"Done":lang==="de"?"Fertig":"Klaar"} ✓
        </button>}
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,color:isDark?"#555":"#888",fontWeight:700,letterSpacing:1,marginBottom:8}}>
          {"TEMPO"}
        </div>
        <div style={{display:"flex",gap:6}}>
          {tempoLabels.slice(1).map((l,i)=>(
            <button key={i} onClick={()=>setTempo(i+1)} style={{flex:1,padding:"8px 4px",borderRadius:10,border:`1px solid ${tempo===i+1?LIME:BORDER}`,background:tempo===i+1?"rgba(200,241,56,0.1)":isDark?"#111":CARD_BG,color:tempo===i+1?LIME:isDark?"#555":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>
      </div>
      {(ex.name==="Wandelen"||ex.name==="Treadmill Walk"||ex.name==="Lopen op helling")&&(
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <div style={{fontSize:11,color:isDark?"#555":"#888",fontWeight:700,letterSpacing:1}}>
              {"INCLINE"}
            </div>
            <div style={{fontSize:13,fontWeight:800,color:incline>0?LIME:isDark?"#555":"#888"}}>{incline}%</div>
          </div>
          <div style={{display:"flex",gap:6}}>
            {[0,2,4,6,8,10,12].map(v=>(
              <button key={v} onClick={()=>setIncline(v)} style={{flex:1,padding:"6px 2px",borderRadius:8,border:`1px solid ${incline===v?LIME:BORDER}`,background:incline===v?"rgba(200,241,56,0.1)":isDark?"#111":CARD_BG,color:incline===v?LIME:isDark?"#444":"#888",fontSize:10,fontWeight:700,cursor:"pointer"}}>
                {v}%
              </button>
            ))}
          </div>
        </div>
      )}
      {elapsed>0&&!running&&(
        <button onClick={()=>{setElapsed(0);setRunning(false);}} style={{width:"100%",padding:8,borderRadius:10,border:`1px solid ${BORDER}`,background:"none",color:isDark?"#333":"#888",fontSize:11,cursor:"pointer",marginTop:4}}>
          {"Timer resetten"}
        </button>
      )}
    </div>
  );
}

                            <button onClick={async()=>{
                              const nu=await sbToggleLike(sbUser.id,user.user_id);
                              setMyLikes(prev=>{const n=new Set(prev);nu?n.add(user.user_id):n.delete(user.user_id);return n;});
                            }} style={{width:32,height:32,borderRadius:"50%",border:"1px solid "+(liked?"rgba(239,68,68,0.4)":BORDER),background:liked?"rgba(239,68,68,0.1)":"none",color:liked?"#ef4444":isDark?"#444":"#888",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                              {liked?"❤️":"🤍"}
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {!rangLaden&&ranglijst.length===0&&(
                <div style={{...S.card,padding:32,textAlign:"center"}}>
                  <div style={{fontSize:32,marginBottom:12}}>🏋️</div>
                  <div style={{fontSize:14,fontWeight:800,color:TEXT,marginBottom:8}}>Nog geen andere sporters</div>
                  <div style={{fontSize:12,color:isDark?"#444":"#888",lineHeight:1.6}}>Nodig vrienden uit om samen op de ranglijst te staan.</div>
                </div>
              )}

              <button onClick={()=>{setRangLaden(true);sbGetLeaderboard().then(d=>{setRanglijst(d);setRangLaden(false);});sbUpdateSocialProfile(sbUser.id,profile,fitPoints,log);}} style={{width:"100%",padding:12,borderRadius:12,border:"1px solid "+BORDER,background:"none",color:isDark?"#444":"#888",fontSize:12,cursor:"pointer",marginTop:12,marginBottom:80}}>
                Vernieuwen
              </button>
            </>}

            {sociaalTab==="profiel"&&(()=>{
              const level=berekenLevel(fitPoints);
              const rang=getRang(level);
              return(
                <div>
                  <div style={{...S.card,padding:24,marginBottom:16,textAlign:"center"}}>
                    <div style={{width:80,height:80,borderRadius:"50%",overflow:"hidden",margin:"0 auto 12px",border:"3px solid "+rang.kleur,background:isDark?"#1C1C1C":"#E8E8E0",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {profile.fotoUrl?<img src={profile.fotoUrl} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:36}}>👤</span>}
                    </div>
                    <div style={{fontSize:22,fontWeight:900,color:TEXT,marginBottom:4}}>{profile.name}</div>
                    <div style={{fontSize:13,color:rang.kleur,fontWeight:700,marginBottom:2}}>{rang.emoji} {getRangNaam(rang,lang)}</div>
                    <div style={{fontSize:12,color:isDark?"#555":"#888",marginBottom:16}}>Level {level}</div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
                      {[
                        {l:"FitPoints",v:(fitPoints||0).toLocaleString(),c:rang.kleur},
                        {l:lang==="en"?"Workouts":lang==="de"?"Trainings":"Trainingen",v:log.length,c:TEXT},
                        {l:"Streak",v:calcStreak(log)+" d",c:LIME},
                      ].map(s=>(
                        <div key={s.l} style={{padding:"10px 8px",background:isDark?"#111":CARD_BG,borderRadius:10}}>
                          <div style={{fontSize:18,fontWeight:900,color:s.c,marginBottom:2}}>{s.v}</div>
                          <div style={{fontSize:10,color:isDark?"#444":"#888"}}>{s.l}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{fontSize:11,color:isDark?"#444":"#888",marginBottom:12}}>Dit is hoe anderen jou zien op de ranglijst</div>
                    <button onClick={()=>{sbUpdateSocialProfile(sbUser.id,profile,fitPoints,log);alert(lang==="en"?"Profile updated!":lang==="de"?"Profil aktualisiert!":"Profiel bijgewerkt!");}} style={{padding:"10px 24px",borderRadius:12,border:"none",background:LIME,color:"#000",fontSize:12,fontWeight:800,cursor:"pointer"}}>
                      Profiel bijwerken
                    </button>
                  </div>
                  <div style={{...S.card,padding:16,marginBottom:80}}>
                    <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:12}}>Ranglijst positie</div>
                    {myRank>0?(
                      <div style={{display:"flex",alignItems:"center",gap:12}}>
                        <div style={{fontSize:40,fontWeight:900,color:LIME}}>#{myRank}</div>
                        <div>
                          <div style={{fontSize:14,fontWeight:700,color:TEXT}}>van {ranglijst.length} sporters</div>
                          <div style={{fontSize:11,color:isDark?"#444":"#888"}}>Train meer om te stijgen!</div>
                        </div>
                      </div>
                    ):(
                      <div style={{fontSize:12,color:isDark?"#444":"#888"}}>Sla eerst een training op om op de ranglijst te komen.</div>
                    )}
                  </div>
                </div>
              );
            })()}
          </div>
        );
      })()}
      {tab==="fitpoints"&&(()=>{
        const level=berekenLevel(fitPoints);
        const rang=getRang(level);
        const fpDitLevel=getFPVoorLevel(level)||0;
        const fpVolgend=getFPVoorLevel(level+1)||fpDitLevel+500;
        const progress=fpVolgend>fpDitLevel?Math.min(100,((fitPoints-fpDitLevel)/(fpVolgend-fpDitLevel))*100):100;
        return(
          <div style={{padding:"24px 16px"}}>
            <div style={{fontSize:11,color:rang.kleur,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>FitPoints</div>
            <div style={{fontSize:30,fontWeight:900,letterSpacing:-1,marginBottom:20,color:TEXT}}>Jouw rang</div>
            <div style={{...S.card,padding:24,marginBottom:16,textAlign:"center",borderTop:"3px solid "+rang.kleur}}>
              <div style={{fontSize:64,marginBottom:8}}>{rang.emoji}</div>
              <div style={{fontSize:28,fontWeight:900,color:rang.kleur,marginBottom:4}}>{getRangNaam(rang,lang)}</div>
              <div style={{fontSize:14,color:isDark?"#555":"#888",marginBottom:16}}>Level {level}</div>
              <div style={{fontSize:40,fontWeight:900,color:TEXT,marginBottom:4}}>{fitPoints.toLocaleString()}</div>
              <div style={{fontSize:12,color:isDark?"#444":"#888",marginBottom:16}}>FitPoints totaal</div>
              <div style={{background:isDark?"#1C1C1C":"#E8E8E0",borderRadius:99,height:8,overflow:"hidden",marginBottom:6}}>
                <div style={{width:progress+"%",height:8,background:"linear-gradient(90deg,"+rang.kleur+","+rang.kleur+"aa)",borderRadius:99,transition:"width .6s"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:isDark?"#444":"#888"}}>
                <span>Level {level}</span>
                <span>{fitPoints.toLocaleString()} / {fpVolgend?.toLocaleString()||"Max"} FP</span>
                <span>Level {level+1}</span>
              </div>
            </div>
            <div style={{...S.card,padding:16,marginBottom:16}}>
              <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:12}}>FP verdienen</div>
              {[
                {actie:T.trainAfronden,fp:150,icon:"💪"},
                {actie:T.cardioVoltooien,fp:100,icon:"🏃"},
                {actie:T.maaltijdLoggen,fp:25,icon:"🥗"},
                {actie:T.prVestigen,fp:75,icon:"🏆"},
                {actie:T.gewichtBijhouden,fp:30,icon:"⚖️"},
                {actie:T.dagdoelWater,fp:60,icon:"💧"},
                {actie:T.driedaagseStreak,fp:50,icon:"🔥"},
                {actie:T.zevenDaagseStreak,fp:200,icon:"⚡"},
              ].map(({actie,desc,fp,icon})=>(
                <div key={actie} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:10,marginBottom:10,borderBottom:"1px solid "+(isDark?"#111":"#E8E8E0")}}>
                  <div style={{display:"flex",gap:10,alignItems:"center",flex:1}}>
                    <span style={{fontSize:20,flexShrink:0}}>{icon}</span>
                    <div><div style={{fontSize:13,color:TEXT,fontWeight:600}}>{actie}</div>{desc&&<div style={{fontSize:10,color:isDark?"#444":"#999",marginTop:1}}>{desc}</div>}</div>
                  </div>
                  <div style={{fontSize:14,fontWeight:900,color:rang.kleur,flexShrink:0,marginLeft:8}}>+{fp}</div>
                </div>
              ))}
            </div>
            <div style={{...S.card,padding:16,marginBottom:16}}>
              <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:12}}>Alle rangen</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                {RANGEN.map(r=>(
                  <div key={r.naam} style={{textAlign:"center",padding:"12px 8px",borderRadius:12,background:rang.naam===r.naam?isDark?"rgba(200,241,56,0.08)":"rgba(200,241,56,0.05)":isDark?"#111":CARD_BG,border:"1px solid "+(rang.naam===r.naam?LIME:BORDER)}}>
                    <div style={{fontSize:28,marginBottom:4}}>{r.emoji}</div>
                    <div style={{fontSize:11,fontWeight:800,color:rang.naam===r.naam?LIME:TEXT,marginBottom:2}}>{r.naam}</div>
                    <div style={{fontSize:9,color:isDark?"#444":"#888"}}>Lvl {r.minLevel}{r.maxLevel<999?"-"+r.maxLevel:"+"}</div>
                  </div>
                ))}
              </div>
            </div>
            <button onClick={()=>{if(window.confirm("FitPoints resetten?")){{setFitPoints(0);LS.set("fitcoach_fp",0);}}}} style={{width:"100%",padding:12,borderRadius:12,border:"1px solid "+BORDER,background:"none",color:isDark?"#333":"#888",fontSize:11,cursor:"pointer",marginBottom:80}}>Reset FitPoints (dev)</button>
          </div>
        );
      })()}
      {/* Zwevende Roan knop tijdens training */}
      {session&&session.length>0&&tab===T.training&&!selectingMuscles&&!showFinn&&(
        <button onClick={()=>{
          const huidigeOef=session.find(e=>!Object.values(e.setsDone||{}).every(Boolean))?.name||session[0]?.name;
          const klaar=session.filter(e=>Object.values(e.setsDone||{}).some(Boolean)).length;
          const ctx=lang==="en"?`I'm training. Currently: ${huidigeOef}. ${klaar} of ${session.length} exercises done. Give me a short motivating tip or answer my question.`:lang==="de"?`Ich trainiere gerade. Aktuell: ${huidigeOef}. ${klaar} von ${session.length} Übungen fertig. Gib mir einen kurzen Motivationstipp oder beantworte meine Frage.`:`Ik ben aan het trainen. Bezig met: ${huidigeOef}. ${klaar} van ${session.length} oefeningen voltooid. Geef me een korte motiverende tip of beantwoord mijn vraag over deze oefening.`;openFinnWith(ctx);
        }} style={{position:"fixed",bottom:80,right:14,width:58,height:58,borderRadius:"50%",background:ORANGE,border:"3px solid #fff",cursor:"pointer",zIndex:25,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 6px 24px rgba(255,107,43,0.5)",animation:"finnBob 3s ease-in-out infinite"}}>
          <FinnImg size={42}/>
        </button>
      )}
      <style>{`@keyframes finnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}`}</style>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:isDark?"rgba(13,13,13,0.97)":"rgba(245,245,240,0.97)",borderTop:`1px solid ${BORDER}`,display:"flex",zIndex:20,backdropFilter:"blur(24px)"}}>
        {[
          {id:T.home,svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
          {id:T.training,svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 4v16M18 4v16M2 8h4M18 8h4M2 16h4M18 16h4"/></svg>},
          {id:T.voortgang,svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>},
          {id:T.voeding,svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2C8 2 4 6 4 10c0 5.25 8 12 8 12s8-6.75 8-12c0-4-4-8-8-8z"/></svg>},
          {id:"sociaal",l:lang==="en"?"SOCIAL":lang==="de"?"SOZIAL":"SOCIAAL",svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>},
  {id:"fitpoints",l:"FP",svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>},
  {id:T.coach,svg:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>},
        ].map(t=>(
          <button key={t.id} onClick={()=>{
            if(t.id===T.training&&tab===T.training&&!selectingMuscles){setSelectingMuscles(true);setSession(null);setTargetMuscles([]);}
            else{setTab(t.id);}
          }} style={{flex:1,padding:"12px 4px 10px",border:"none",background:"none",cursor:"pointer",color:tab===t.id?(t.id===T.coach?ORANGE:LIME):isDark?"#777":"#999",display:"flex",flexDirection:"column",alignItems:"center",gap:4,transition:"color .15s"}}>
            {t.svg}
            <div style={{fontSize:9,fontWeight:700,letterSpacing:0.5}}>{t.l||t.id.toUpperCase()}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
