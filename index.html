*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
input,select,button{font-family:inherit}

#installModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:flex-end;justify-content:center}
#installModal.show{display:flex}

<script>
if('serviceWorker' in navigator){
  // Unregister old SW + clear ALL caches so new index.html is always loaded fresh
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
  caches.keys().then(keys=>{keys.forEach(k=>caches.delete(k));});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      reg.update();
      console.log('SW registered');
    }).catch(()=>{});
  });
}
</script>

  const en={Starter:"Starter",Hout:"Wood",Steen:"Stone",IJzer:"Iron",Brons:"Bronze",Zilver:"Silver",Goud:"Gold",Platina:"Platinum",Saffier:"Sapphire",Smaragd:"Emerald",Diamant:"Diamond",Meester:"Master",Legende:"Legend"};
  const de={Starter:"Starter",Hout:"Holz",Steen:"Stein",IJzer:"Eisen",Brons:"Bronze",Zilver:"Silber",Goud:"Gold",Platina:"Platin",Saffier:"Saphir",Smaragd:"Smaragd",Diamant:"Diamant",Meester:"Meister",Legende:"Legende"};
  if(lang==="en")return en[nl]||nl;
  if(lang==="de")return de[nl]||nl;
  return nl;
}
function getFPVoorLevel(level){
  // Eerste 11 levels: vast aantal FP
  if(level<=11)return[0,100,200,350,500,700,900,1150,1400,1700,2000,2500][level]||2500;
  // Level 12+: wekelijks 3000 FP nodig per level
  return null; // wekelijks systeem
}

function getSplitLabel(label,lang){
  const en={"Hardlopen":"Running","Wandelen":"Walking","Spinning":"Spinning","Zwemmen":"Swimming","Kracht":"Strength","Push":"Push","Pull":"Pull","Benen":"Legs","Schouders":"Shoulders","Rug":"Back","Borst":"Chest","Armen":"Arms","Buik":"Abs","Billen":"Glutes"};
  const de={"Hardlopen":"Laufen","Wandelen":"Gehen","Spinning":"Spinning","Zwemmen":"Schwimmen","Kracht":"Kraft","Push":"Drücken","Pull":"Ziehen","Benen":"Beine","Schouders":"Schultern","Rug":"Rücken","Borst":"Brust","Armen":"Arme","Buik":"Bauch","Billen":"Gesäss"};
  if(lang==="en")return en[label]||label;
  if(lang==="de")return de[label]||label;
  return label;
}
function berekenLevel(totalFP,weekFP){
  // Simpel cumulatief systeem voor eerste 11 levels
  let level=0;
  for(let i=1;i<=11;i++){if(totalFP>=getFPVoorLevel(i))level=i;else break;}
  return level;
}

async function sbGetLeaderboard(){
  try{
    const {data}=await sb.from("social_profiles")
      .select("user_id,display_name,foto_url,fit_points,level,rang_naam,rang_emoji,trainingen_count,updated_at")
      .order("fit_points",{ascending:false})
      .limit(50);
    return data||[];
  }catch(e){return [];}
}
async function sbUpdateSocialProfile(userId,profile,fitPoints,log){
  try{
    const level=berekenLevel(fitPoints);
    const rang=getRang(level);
    await sb.from("social_profiles").upsert({
      user_id:userId,
      display_name:profile.name||"Gebruiker",
      foto_url:profile.fotoUrl||null,
      fit_points:fitPoints,
      level,
      rang_naam:rang.naam,
      rang_emoji:rang.emoji,
      trainingen_count:log.length,
      updated_at:new Date().toISOString()
    },{onConflict:"user_id"});
  }catch(e){}
}
async function sbToggleLike(userId,targetUserId){
  try{
    const {data:existing}=await sb.from("social_likes")
      .select("id").eq("from_user",userId).eq("to_user",targetUserId).maybeSingle();
    if(existing){
      await sb.from("social_likes").delete().eq("id",existing.id);
      return false;
    }else{
      await sb.from("social_likes").insert({from_user:userId,to_user:targetUserId,created_at:new Date().toISOString()});
      return true;
    }
  }catch(e){return false;}
}
async function sbGetMyLikes(userId){
  try{
    const {data}=await sb.from("social_likes").select("to_user").eq("from_user",userId);
    return new Set((data||[]).map(d=>d.to_user));
  }catch(e){return new Set();}
}

async function sbLoad(table,userId){try{const {data}=await sb.from(table).select("*").eq("user_id",userId).maybeSingle();return data;}catch(e){return null;}}

  fp+=(log||[]).length*FP_VERDIEN.training;

  fp+=Object.keys(food||{}).length*FP_VERDIEN.voeding;
  fp+=Object.keys(weightLog||{}).length*FP_VERDIEN.gewicht;
  if(streak>=3)fp+=FP_VERDIEN.streak3;
  if(streak>=7)fp+=FP_VERDIEN.streak7;
  if(streak>=14)fp+=FP_VERDIEN.streak14;
  if(streak>=30)fp+=FP_VERDIEN.streak30;
  return Math.round(fp);
}

async function ai(prompt){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    const r=await fetch(WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:350,messages:[{role:"user",content:prompt}]}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(!r.ok)return"Roan is even niet beschikbaar. Probeer het opnieuw.";
    // Streaming SSE response
    const ct=r.headers.get("content-type")||"";
    if(ct.includes("event-stream")){
      const reader=r.body.getReader();
      const decoder=new TextDecoder();
      let full="";
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        const chunk=decoder.decode(value,{stream:true});
        const lines=chunk.split("\n");
        for(const line of lines){
          if(line.startsWith("data: ")){
            const data=line.slice(6).trim();
            if(data==="[DONE]")break;
            try{
              const j=JSON.parse(data);
              const t=j.delta?.text||j.content_block?.text||"";
              if(t)full+=t;
            }catch{}
          }
        }
      }
      return full||"Roan heeft geen antwoord. Probeer het opnieuw.";
    }
    // Fallback to JSON
    const d=await r.json();
    if(d.content?.[0]?.text)return d.content[0].text;
    if(d.text)return d.text;
    return"Roan heeft geen antwoord. Probeer het opnieuw.";
  }catch(e){
    if(e.name==="AbortError")return"Roan reageert te langzaam. Probeer het opnieuw.";
    return"Verbindingsfout. Controleer je internet.";
  }
}

// Streaming AI met live callback voor letter-voor-letter chat
async function aiStream(prompt,onChunk){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),22000);
    const r=await fetch(WORKER,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:400,messages:[{role:"user",content:prompt}]}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(!r.ok){onChunk("Roan is even niet beschikbaar.");return"Roan is even niet beschikbaar.";}

    // Probeer JSON eerst (worker stuurt gewoon JSON terug)
    const text=await r.text();
    let txt="";
    try{
      const d=JSON.parse(text);
      txt=d.content?.[0]?.text||d.text||d.response||"";
    }catch{
      // Misschien SSE — parse als event-stream
      const lines=text.split("\n");
      for(const line of lines){
        if(line.startsWith("data: ")){
          const data=line.slice(6).trim();
          if(data==="[DONE]")continue;
          try{
            const j=JSON.parse(data);
            txt+=j.delta?.text||j.content_block?.text||"";
          }catch{}
        }
      }
    }
    if(!txt)txt="Roan heeft geen antwoord. Probeer het opnieuw.";

    // Simuleer streaming met snelle chunks voor mooie UX
    const words=txt.split(" ");
    let built="";
    for(let i=0;i<words.length;i++){
      built+=(i>0?" ":"")+words[i];
      onChunk(built);
      // Kleine pauze per woord (15ms)
      await new Promise(res=>setTimeout(res,15));
    }
    return txt;
  }catch(e){
    const msg=e.name==="AbortError"?"Roan reageert te langzaam. Probeer opnieuw.":"Verbindingsfout. Check je internet.";
    onChunk(msg);return msg;
  }
}

function haptic(type){
  try{
    if(!navigator.vibrate)return;
    if(type==="light")navigator.vibrate(10);
    else if(type==="medium")navigator.vibrate(25);
    else if(type==="success")navigator.vibrate([10,30,10]);
    else if(type==="pr")navigator.vibrate([20,50,20,50,80]);
    else navigator.vibrate(15);
  }catch(e){}
}
function beep(freq,duration,vol){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value=freq||440;
    osc.type="sine";
    gain.gain.setValueAtTime(vol||0.15,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(duration||0.15));
    osc.start();
    osc.stop(ctx.currentTime+(duration||0.15));
  }catch(e){}
}
function speak(txt,lang){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const appLang=lang||localStorage.getItem("fitcoach_lang")||"nl";
  u.lang=appLang==="en"?"en-GB":appLang==="de"?"de-DE":"nl-NL";
  u.rate=1.0;u.pitch=1.0;
  const voices=window.speechSynthesis.getVoices();
  const match=voices.find(v=>v.lang.startsWith(u.lang.split("-")[0]))||voices[0];
  if(match)u.voice=match;
  window.speechSynthesis.speak(u);
}
function startListening(onResult,onEnd){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const appLang=localStorage.getItem("fitcoach_lang")||"nl";
  const r=new SR();r.lang=appLang==="en"?"en-GB":appLang==="de"?"de-DE":"nl-NL";r.continuous=false;r.interimResults=false;
  r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase().trim();onResult(t);};
  r.onend=()=>{if(onEnd)onEnd();};r.onerror=()=>{if(onEnd)onEnd();};r.start();return r;
}

function adjustForGoal(exercises,goal,sportType){
  if(!goal||sportType==="hiit"||sportType==="cardio")return exercises;
  return exercises.map(ex=>{
    const e={...ex};
    if(goal==="afvallen"){
      e.reps=typeof e.reps==="string"&&e.reps.includes("-")?e.reps.split("-").map((n,i)=>i===0?parseInt(n)+2:parseInt(n)+4).join("-"):e.reps;
      e.weights=e.weights.map(w=>w>0?Math.max(0,Math.round(w*0.8)):0);
      e.restSecs=Math.min(45,e.restSecs||60);
    } else if(goal==="spiermassa"){
      e.reps=typeof e.reps==="string"&&e.reps.includes("-")?e.reps.split("-").map(n=>Math.max(4,parseInt(n)-2)).join("-"):e.reps;
      e.weights=e.weights.map(w=>w>0?Math.round(w*1.05):0);
      e.restSecs=Math.min(90,Math.max(60,e.restSecs||60));
    } else if(goal==="fitter"){
      e.restSecs=Math.min(45,e.restSecs||60);
    }
    return e;
  });
}

    setFase("live");setBanen(0);setElapsed(0);setSplits([]);elapsedRef.current=0;setRunning(true);
    timerRef.current=setInterval(()=>{elapsedRef.current+=1;setElapsed(elapsedRef.current);},1000);
  }
  function baanGedaan(){
    const nb=banen+1;
    setBanen(nb);
    setSplits(p=>[...p,{baan:nb,tijd:elapsedRef.current}]);
    if(nb>=doelBanen){clearInterval(timerRef.current);setRunning(false);setFase("klaar");}
  }
  function stopLive(){clearInterval(timerRef.current);setRunning(false);setFase("klaar");}
  useEffect(()=>()=>clearInterval(timerRef.current),[]);

  const S={card:{background:CARD_BG,borderRadius:14,border:"1px solid "+BORDER}};
  const BLAUW="#60a5fa";

  if(fase==="setup")return(
    <div>
      <div style={{height:130,borderRadius:14,overflow:"hidden",position:"relative",marginBottom:16,background:isDark?"#111":CARD_BG}}>
        <img src={P.rug} alt="Zwemmen" style={{width:"100%",height:"100%",objectFit:"cover",opacity:0.6}}/>
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent,rgba(0,0,0,0.8))"}}/>
        <div style={{position:"absolute",bottom:14,left:16}}>
          <div style={{fontSize:10,letterSpacing:3,color:BLAUW,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Zwemmen</div>
          <div style={{fontSize:22,fontWeight:900,color:"#fff"}}>Stel je training in</div>
        </div>
      </div>
      <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Hoe wil je bijhouden?</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {[{v:"live",l:"Live tellen",d:"Tik na elke baan — telefoon in waterdicht hoesje"},{v:"achteraf",l:"Achteraf invoeren",d:"Vul in na je training"}].map(m=>(
          <button key={m.v} onClick={()=>setModus(m.v)} style={{padding:"13px 12px",borderRadius:12,border:"1px solid "+(modus===m.v?BLAUW:BORDER),background:modus===m.v?"rgba(96,165,250,0.08)":isDark?"#111":CARD_BG,cursor:"pointer",textAlign:"left"}}>
            <div style={{fontSize:13,fontWeight:800,color:modus===m.v?BLAUW:TEXT,marginBottom:3}}>{m.l}</div>
            <div style={{fontSize:10,color:isDark?"#444":"#888",lineHeight:1.4}}>{m.d}</div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {BAANLENGTE.map(m=>(
          <button key={m} onClick={()=>setBaanM(m)} style={{flex:1,padding:"12px",borderRadius:12,border:"1px solid "+(baanM===m?BLAUW:BORDER),background:baanM===m?"rgba(96,165,250,0.08)":isDark?"#111":CARD_BG,cursor:"pointer",textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:900,color:baanM===m?BLAUW:TEXT}}>{m}m</div>
            <div style={{fontSize:10,color:isDark?"#444":"#888",marginTop:2}}>{m===25?"Klein bad":"Olympisch bad"}</div>
          </button>
        ))}
      </div>
      <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Slag</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {SLAGEN.map(s=>(
          <button key={s.v} onClick={()=>setSlag(s.v)} style={{padding:"11px 14px",borderRadius:12,border:"1px solid "+(slag===s.v?BLAUW:BORDER),background:slag===s.v?"rgba(96,165,250,0.08)":isDark?"#111":CARD_BG,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:700,color:slag===s.v?BLAUW:TEXT}}>{s.l}</span>
            <span style={{fontSize:10,color:isDark?"#333":"#999"}}>{Math.round(gewicht*s.cal*100)} kcal/100m</span>
          </button>
        ))}
      </div>
      {modus==="live"&&<>
        <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Doel</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:16}}>
          {[10,20,30,40,50,60,80,100].map(n=>(
            <button key={n} onClick={()=>setDoelBanen(n)} style={{padding:"10px 4px",borderRadius:10,border:"1px solid "+(doelBanen===n?BLAUW:BORDER),background:doelBanen===n?"rgba(96,165,250,0.08)":isDark?"#111":CARD_BG,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:13,fontWeight:800,color:doelBanen===n?BLAUW:TEXT}}>{n}</div>
              <div style={{fontSize:9,color:isDark?"#333":"#999"}}>{n*baanM}m</div>
            </button>
          ))}
        </div>
      </>}
      {modus==="achteraf"&&<>
        <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Training invoeren</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
          <div>
            <div style={{fontSize:11,color:isDark?"#555":"#888",marginBottom:6}}>Aantal banen</div>
            <input type="number" value={aNBanen} onChange={e=>setANBanen(e.target.value)} placeholder="bijv. 40" style={{width:"100%",padding:"13px 14px",borderRadius:12,border:"1px solid "+BORDER,background:isDark?"#111":CARD_BG,color:TEXT,fontSize:16,fontWeight:700,outline:"none",boxSizing:"border-box"}}/>
          </div>
          <div>
            <div style={{fontSize:11,color:isDark?"#555":"#888",marginBottom:6}}>Tijd (minuten)</div>
            <input type="number" value={aTijd} onChange={e=>setATijd(e.target.value)} placeholder="bijv. 45" style={{width:"100%",padding:"13px 14px",borderRadius:12,border:"1px solid "+BORDER,background:isDark?"#111":CARD_BG,color:TEXT,fontSize:16,fontWeight:700,outline:"none",boxSizing:"border-box"}}/>
          </div>
        </div>
      </>}
      {(modus==="live"||aNBanen)&&<div style={{...S.card,padding:"10px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"2px solid "+BLAUW}}>
        <span style={{fontSize:12,color:isDark?"#555":"#888"}}>Geschatte calorieën</span>
        <span style={{fontSize:16,fontWeight:900,color:BLAUW}}>~{modus==="live"?Math.round(gewicht*slagInfo.cal*doelBanen*baanM):Math.round(gewicht*slagInfo.cal*(parseInt(aNBanen)||0)*baanM)} kcal</span>
      </div>}

      <button onClick={()=>{
        if(modus==="achteraf"){
          if(!aNBanen)return;
          const totM=(parseInt(aNBanen)||0)*baanM;
          const totSec=(parseFloat(aTijd)||0)*60;
          onDone({sport:"zwemmen",banen:parseInt(aNBanen),afstand:totM,tijd:totSec,cal:Math.round(gewicht*slagInfo.cal*totM),slag,baanM});
        } else {
          startLive();
        }
      }} disabled={modus==="achteraf"&&!aNBanen} style={{width:"100%",padding:18,borderRadius:14,border:"none",cursor:modus==="achteraf"&&!aNBanen?"default":"pointer",background:modus==="achteraf"&&!aNBanen?"#1C1C1C":BLAUW,color:modus==="achteraf"&&!aNBanen?isDark?"#444":"#888":"#000",fontSize:16,fontWeight:900}}>
        {modus==="achteraf"?"Opslaan":"Start zwemmen"}
      </button>
    </div>
  );

  if(fase==="live")return(
    <div>
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:6}}>
          <span>{lang==="en"?"Progress":"Voortgang"}</span><span>{banen} / {doelBanen} banen</span>
        </div>
        <div style={{background:isDark?"#111":"#E8E8E0",borderRadius:99,height:8,overflow:"hidden"}}>
          <div style={{width:Math.min(100,banen/doelBanen*100)+"%",height:8,background:BLAUW,borderRadius:99,transition:"width .3s"}}/>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div style={{...S.card,padding:16,textAlign:"center",borderTop:"2px solid "+BLAUW}}>
          <div style={{fontSize:10,color:BLAUW,fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Banen</div>
          <div style={{fontSize:52,fontWeight:900,color:BLAUW,letterSpacing:-2,lineHeight:1}}>{banen}</div>
          <div style={{fontSize:11,color:isDark?"#444":"#888",marginTop:2}}>{totaalM}m</div>
        </div>
        <div style={{...S.card,padding:16,textAlign:"center",borderTop:"2px solid "+BORDER}}>
          <div style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Tijd</div>
          <div style={{fontSize:40,fontWeight:900,letterSpacing:-1,lineHeight:1}}>{fmtTime(elapsed)}</div>
        </div>
        <div style={{...S.card,padding:14,textAlign:"center"}}>
          <div style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Tempo</div>
          <div style={{fontSize:24,fontWeight:900,letterSpacing:-0.5}}>{banen>0&&elapsed>0?fmtTime(Math.round(elapsed/banen)):"–"}</div>
          <div style={{fontSize:10,color:isDark?"#444":"#888"}}>per baan</div>
        </div>
        <div style={{...S.card,padding:14,textAlign:"center"}}>
          <div style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:4}}>Calorieën</div>
          <div style={{fontSize:24,fontWeight:900,color:ORANGE,letterSpacing:-0.5}}>{kcal}</div>
        </div>
      </div>
      <button onClick={baanGedaan} style={{width:"100%",padding:24,borderRadius:16,border:"none",cursor:"pointer",background:BLAUW,color:"#000",fontSize:20,fontWeight:900,marginBottom:10,letterSpacing:-0.5}}>
        Baan {banen+1} klaar
      </button>
      <button onClick={stopLive} style={{width:"100%",padding:12,borderRadius:12,border:"1px solid rgba(239,68,68,0.3)",background:"none",color:"#ef4444",fontSize:13,fontWeight:700,cursor:"pointer"}}>{lang==="en"?"Stop":lang==="de"?"Stoppen":"Stoppen"}</button>
    </div>
  );

  return(
    <div style={{textAlign:"center",padding:"24px 0"}}>
      <div style={{fontSize:11,letterSpacing:4,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Zwemtraining voltooid</div>
      <div style={{fontSize:72,fontWeight:900,letterSpacing:-4,color:BLAUW,lineHeight:1,marginBottom:4}}>{banen}</div>
      <div style={{fontSize:16,color:isDark?"#555":"#888",marginBottom:20}}>banen · {totaalM}m</div>
      <div style={{display:"flex",justifyContent:"center",gap:28,marginBottom:24}}>
        {[{l:"Tijd",v:fmtTime(elapsed)},{l:"Tempo",v:banen>0?fmtTime(Math.round(elapsed/banen))+" /baan":"–"},{l:"Calorieën",v:kcal+" kcal"}].map(s=>(
          <div key={s.l} style={{textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:900,color:TEXT}}>{s.v}</div>
            <div style={{fontSize:10,color:"#555",marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      <button onClick={()=>onDone({sport:"zwemmen",banen,afstand:totaalM,tijd:elapsed,cal:kcal,slag,baanM})} style={{width:"100%",padding:16,borderRadius:14,border:"none",cursor:"pointer",background:BLAUW,color:"#000",fontSize:15,fontWeight:900}}>{T.opslaan}</button>
    </div>
  );
}

function SpinTracker({onDone,profile}){
  const _lang=LS.get("fitcoach_lang")||"nl";
  const lang=_lang;
  const T=TRANSLATIONS[_lang]||TRANSLATIONS.nl;
  const [fase,setFase]=useState("setup");
  const [modus,setModus]=useState("steady");
  const [doelMinuten,setDoelMinuten]=useState(30);
  const [weerstand,setWeerstand]=useState(5);
  const [elapsed,setElapsed]=useState(0);
  const [running,setRunning]=useState(false);
  const [intervalFase,setIntervalFase]=useState("werk");
  const [intervalLeft,setIntervalLeft]=useState(40);
  const [werkSec,setWerkSec]=useState(40);
  const [rustSec,setRustSec]=useState(20);
  const timerRef=useRef(null),intRef=useRef(null),elapsedRef=useRef(0);
  const gewicht=parseFloat(profile?.weight)||75;
  const MET=modus==="sprint"?10:modus==="interval"?8:6;
  const kcal=Math.round(MET*gewicht*3.5/200*(elapsed/60));
  function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return m+":"+String(sec).padStart(2,"0");}
  function start(){
    setFase("fietsen");setRunning(true);setElapsed(0);elapsedRef.current=0;
    timerRef.current=setInterval(()=>{
      elapsedRef.current+=1;setElapsed(elapsedRef.current);
      if(doelMinuten>0&&elapsedRef.current>=doelMinuten*60){clearInterval(timerRef.current);setRunning(false);setFase("klaar");}
    },1000);
    if(modus==="interval"){
      setIntervalLeft(werkSec);setIntervalFase("werk");
      intRef.current=setInterval(()=>{
        setIntervalLeft(l=>{
          if(l<=1){setIntervalFase(f=>{if(f==="werk"){setIntervalLeft(rustSec);return"rust";}else{setIntervalLeft(werkSec);return"werk";}});return 0;}
          return l-1;
        });
      },1000);
    }
  }
  function stop(){clearInterval(timerRef.current);clearInterval(intRef.current);setRunning(false);setFase("klaar");}
  useEffect(()=>()=>{clearInterval(timerRef.current);clearInterval(intRef.current);},[]);
  const S={card:{background:CARD_BG,borderRadius:16,border:"1px solid "+BORDER}};
  if(fase==="setup")return(
    <div>
      <div style={{fontSize:11,letterSpacing:3,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:14}}>Spinning instellen</div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:isDark?"#555":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>Trainingsmodus</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[{v:"steady",l:"Steady ride",d:"Constant tempo, vetverbranding"},{v:"interval",l:"Interval",d:"Afwisselend sprint en herstel"},{v:"sprint",l:"Sprint ride",d:"Hoge intensiteit, korte sessie"}].map(m=>(
            <button key={m.v} onClick={()=>setModus(m.v)} style={{padding:"12px 16px",borderRadius:12,border:"1px solid "+(modus===m.v?"#a78bfa":BORDER),background:modus===m.v?"rgba(167,139,250,0.08)":isDark?"#111":CARD_BG,cursor:"pointer",display:"flex",gap:12,alignItems:"center",textAlign:"left"}}>

              <div><div style={{fontSize:13,fontWeight:700,color:modus===m.v?"#a78bfa":TEXT}}>{m.l}</div><div style={{fontSize:11,color:isDark?"#444":"#888"}}>{m.d}</div></div>
            </button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:isDark?"#555":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>Duur (minuten)</div>
        <div style={{display:"flex",gap:8}}>
          {[20,30,45,60,90].map(m=>(
            <button key={m} onClick={()=>setDoelMinuten(m)} style={{flex:1,padding:"10px 4px",borderRadius:10,border:"1px solid "+(doelMinuten===m?"#a78bfa":BORDER),background:doelMinuten===m?"rgba(167,139,250,0.08)":isDark?"#111":CARD_BG,color:doelMinuten===m?"#a78bfa":isDark?"#555":"#888",fontSize:12,fontWeight:700,cursor:"pointer"}}>{m}m</button>
          ))}
        </div>
      </div>
      {modus==="interval"&&(
        <div style={{...S.card,padding:14,marginBottom:14}}>
          <div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:10}}>Interval instelling</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:isDark?"#555":"#888",marginBottom:6}}>Sprint duur</div>
            <div style={{display:"flex",gap:6}}>{[20,30,40,60].map(s=><button key={s} onClick={()=>setWerkSec(s)} style={{flex:1,padding:"8px 2px",borderRadius:8,border:"1px solid "+(werkSec===s?ORANGE:BORDER),background:werkSec===s?"rgba(255,107,43,0.08)":isDark?"#111":CARD_BG,color:werkSec===s?ORANGE:isDark?"#444":"#666",fontSize:11,fontWeight:700,cursor:"pointer"}}>{s}s</button>)}</div>
          </div>
          <div>
            <div style={{fontSize:11,color:isDark?"#555":"#888",marginBottom:6}}>Herstel duur</div>
            <div style={{display:"flex",gap:6}}>{[10,20,30,60].map(s=><button key={s} onClick={()=>setRustSec(s)} style={{flex:1,padding:"8px 2px",borderRadius:8,border:"1px solid "+(rustSec===s?LIME:BORDER),background:rustSec===s?"rgba(200,241,56,0.08)":isDark?"#111":CARD_BG,color:rustSec===s?LIME:isDark?"#444":"#666",fontSize:11,fontWeight:700,cursor:"pointer"}}>{s}s</button>)}</div>
          </div>
        </div>
      )}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:isDark?"#555":"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>Weerstand (1-20)</div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>setWeerstand(w=>Math.max(1,w-1))} style={{width:40,height:40,borderRadius:10,border:"1px solid "+BORDER,background:"none",color:TEXT,fontSize:20,cursor:"pointer",fontWeight:300}}>–</button>
          <div style={{flex:1,textAlign:"center",fontSize:36,fontWeight:900,color:"#a78bfa"}}>{weerstand}</div>
          <button onClick={()=>setWeerstand(w=>Math.min(20,w+1))} style={{width:40,height:40,borderRadius:10,border:"1px solid "+BORDER,background:"none",color:TEXT,fontSize:20,cursor:"pointer",fontWeight:300}}>+</button>
        </div>
      </div>
      <button onClick={start} style={{width:"100%",padding:18,borderRadius:14,border:"none",cursor:"pointer",background:"#a78bfa",color:"#000",fontSize:16,fontWeight:900}}>🚴 Start spinning</button>
    </div>
  );
  if(fase==="fietsen")return(
    <div>
      {doelMinuten>0&&(
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:6}}>
            <span>{lang==="en"?"Progress":"Voortgang"}</span><span>{fmtTime(elapsed)} / {doelMinuten}:00</span>
          </div>
          <div style={{background:isDark?"#111":"#E8E8E0",borderRadius:99,height:8,overflow:"hidden"}}>
            <div style={{width:Math.min(100,elapsed/(doelMinuten*60)*100)+"%",height:8,background:"#a78bfa",borderRadius:99,transition:"width 1s linear"}}/>
          </div>
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div style={{...S.card,padding:16,textAlign:"center"}}>
          <div style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Tijd</div>
          <div style={{fontSize:40,fontWeight:900,letterSpacing:-1,lineHeight:1}}>{fmtTime(elapsed)}</div>
        </div>
        <div style={{...S.card,padding:16,textAlign:"center"}}>
          <div style={{fontSize:10,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Calorieën</div>
          <div style={{fontSize:40,fontWeight:900,color:ORANGE,letterSpacing:-1,lineHeight:1}}>{kcal}</div>
        </div>
      </div>
      {modus==="interval"?(
        <div style={{...S.card,padding:"14px 18px",marginBottom:12,border:"1px solid "+(intervalFase==="werk"?"rgba(255,107,43,0.3)":"rgba(200,241,56,0.2)"),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10,color:intervalFase==="werk"?ORANGE:LIME,fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:2}}>{intervalFase==="werk"?"Sprint":"Herstel"}</div>
            <div style={{fontSize:52,fontWeight:900,color:intervalFase==="werk"?ORANGE:LIME,letterSpacing:-2,lineHeight:1}}>{intervalLeft}<span style={{fontSize:14,marginLeft:3}}>s</span></div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:isDark?"#333":"#888",textTransform:"uppercase",letterSpacing:2}}>Weerstand</div>
            <div style={{fontSize:32,fontWeight:900,color:"#a78bfa"}}>{intervalFase==="werk"?Math.min(20,weerstand+3):Math.max(1,weerstand-2)}</div>
          </div>
        </div>
      ):(
        <div style={{...S.card,padding:"14px 18px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10,color:"#a78bfa",fontWeight:700,textTransform:"uppercase",letterSpacing:2,marginBottom:2}}>Weerstand</div>
            <div style={{fontSize:52,fontWeight:900,color:"#a78bfa",letterSpacing:-2}}>{weerstand}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:isDark?"#333":"#888",textTransform:"uppercase",letterSpacing:2}}>Modus</div>
            <div style={{fontSize:18,fontWeight:700,color:TEXT,textTransform:"capitalize"}}>{modus}</div>
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setRunning(r=>!r)} style={{flex:1,padding:16,borderRadius:14,border:"none",cursor:"pointer",background:running?isDark?"#1C1C1C":"#E8E8E0":"#a78bfa",color:running?isDark?"#555":"#888":"#000",fontSize:14,fontWeight:900}}>{running?"⏸ "+(lang==="en"?"Pause":"Pauze"):"▶ Hervat"}</button>
        <button onClick={stop} style={{padding:"16px 20px",borderRadius:14,border:"1px solid rgba(239,68,68,0.3)",background:"none",color:"#ef4444",fontSize:13,fontWeight:700,cursor:"pointer"}}>⏹ Stop</button>
      </div>
    </div>
  );
  return(
    <div style={{textAlign:"center",padding:"24px 0"}}>
      <div style={{fontSize:11,letterSpacing:4,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Spinning voltooid</div>
      <div style={{fontSize:64,fontWeight:900,letterSpacing:-3,color:"#a78bfa",lineHeight:1,marginBottom:4}}>{fmtTime(elapsed)}</div>
      <div style={{fontSize:16,color:isDark?"#555":"#888",marginBottom:20}}>{kcal} kcal verbrand</div>
      <button onClick={()=>onDone({sport:"spinning",tijd:elapsed,cal:kcal,modus,weerstand})} style={{width:"100%",padding:16,borderRadius:14,border:"none",cursor:"pointer",background:"#a78bfa",color:"#000",fontSize:15,fontWeight:900}}>{T.opslaan}</button>
    </div>
  );
}

function RunTracker({voiceOn,onDone,prevRun,profile,log,defaultRunType}){
  const _lang=LS.get("fitcoach_lang")||"nl";
  const lang=_lang;
  const S={card:{background:CARD_BG,borderRadius:16,border:"1px solid "+BORDER}};
  // Hoofdmenu tabs
  const [mainTab,setMainTab]=useState("start"); // start | plannen | geschiedenis | records
  // Run setup
  const GOALS={vrij:{label:"Vrij",target:0,sub:"Geen doel"},k5:{label:"5 km",target:5000,sub:"Beginnersdoel"},k10:{label:"10 km",target:10000,sub:"Intermediate"},half:{label:"Halve marathon",target:21097,sub:"21.1 km"},marathon:{label:"Marathon",target:42195,sub:"42.2 km"}};
  const RUN_TYPES=[
    {v:"steady",l:"Duurloop",d:"Constant tempo, vetverbranding",kleur:LIME},
    {v:"interval",l:"Interval",d:"Sprint & herstel beurtelings",kleur:ORANGE},
    {v:"tempo",l:"Tempoloop",d:"Comfortabel hard, lactaat drempel",kleur:"#f59e0b"},
    {v:"wandel",l:"Wandelen",d:"Rustig of incline wandeling",kleur:"#60a5fa"},
  ];
  const [runType,setRunType]=useState(defaultRunType||"steady");
  const [selectedGoal,setSelectedGoal]=useState("vrij");
  const [sprintSec,setSprintSec]=useState(30);
  const [restSec,setRestSec]=useState(90);
  const [voiceKm,setVoiceKm]=useState(true);
  const [inclineMode,setInclineMode]=useState(false);
  // Actieve run state
  const [phase,setPhase]=useState("setup");
  const [incline,setIncline]=useState(0);
  const [dist,setDist]=useState(0);
  const [elapsed,setElapsed]=useState(0);
  const [isRunning,setIsRunning]=useState(false);
  const [kmSplits,setKmSplits]=useState([]);
  const [gpsError,setGpsError]=useState("");
  const [routePoints,setRoutePoints]=useState([]);
  const [currentPace,setCurrentPace]=useState("–");
  const [intervalPhase,setIntervalPhase]=useState("sprint");
  const [intervalLeft,setIntervalLeft]=useState(sprintSec);
  const [intervalCount,setIntervalCount]=useState(0);
  const [calories,setCalories]=useState(0);
  // Plan state
  const [activePlan,setActivePlan]=useState(()=>LS.get("fitcoach_run_plan")||null);
  // Refs
  const watchRef=useRef(null),timerRef=useRef(null),intRef=useRef(null);
  const lastPosRef=useRef(null),distRef=useRef(0),elapsedRef=useRef(0);
  const kmAlertsRef=useRef([]),routeRef=useRef([]);
  const lastPaceRef=useRef("–"),paceWindowRef=useRef([]);

  const gewicht=parseFloat(profile?.weight)||75;
  function say(txt){if(voiceOn)speak(txt);}
  function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"):m+":"+String(sec).padStart(2,"0");}
  function calcPace(d,t){if(d<50||t<5)return"–";const mpm=(t/60)/(d/1000);if(mpm>20)return"–";return Math.floor(mpm)+":"+String(Math.round((mpm%1)*60)).padStart(2,"0");}
  function calcSpeed(d,t){if(d<50||t<1)return"0.0";return((d/1000)/(t/3600)).toFixed(1);}
  function calcCal(d,t){return Math.round(gewicht*d/1000*(runType==="wandel"?0.8:1.0)*0.95);}
  function hartzone(pace){
    if(pace==="–")return{zone:0,label:"–",color:"#555"};
    const [m,s]=pace.split(":").map(Number);const minKm=m+(s/60);
    if(minKm>8)return{zone:1,label:"Zone 1 — Herstel",color:"#60a5fa"};
    if(minKm>7)return{zone:2,label:"Zone 2 — Vetverbranding",color:"#34d399"};
    if(minKm>6)return{zone:3,label:"Zone 3 — Aerob",color:LIME};
    if(minKm>5)return{zone:4,label:"Zone 4 — Lactaatdrempel",color:ORANGE};
    return{zone:5,label:"Zone 5 — Maximaal",color:"#ef4444"};
  }
  // Hardloop PRs ophalen
  const runPRs=LS.get("fitcoach_run_prs")||{};
  // Hardloopgeschiedenis
  const runHistory=(log||[]).filter(e=>e.runDist>0);

  function startRun(){
    setPhase("running");setIsRunning(true);
    setGpsError("");
    setDist(0);setElapsed(0);setKmSplits([]);setRoutePoints([]);setCalories(0);
    distRef.current=0;elapsedRef.current=0;kmAlertsRef.current=[];routeRef.current=[];paceWindowRef.current=[];gpsReadyRef.current=false;lastPosRef.current=null;
    const g=GOALS[selectedGoal];
    say(g.target>0?g.label+" start!":"Start "+RUN_TYPES.find(r=>r.v===runType)?.l+"!");
    // GPS
    if(navigator.geolocation){
      watchRef.current=navigator.geolocation.watchPosition(pos=>{
        const newP={lat:pos.coords.latitude,lon:pos.coords.longitude,t:Date.now()};
        if(lastPosRef.current){
          const d=haversine(lastPosRef.current,newP);
          if(d>(runType==="wandel"?0.5:1)&&d<200){
            distRef.current+=d;
            setDist(distRef.current);
            routeRef.current=[...routeRef.current,newP];
            setRoutePoints([...routeRef.current]);
            // Rolling pace (laatste 30 seconden)
            paceWindowRef.current=[...paceWindowRef.current,{d:distRef.current,t:elapsedRef.current}].slice(-30);
            if(paceWindowRef.current.length>5){
              const w=paceWindowRef.current;
              const dd=w[w.length-1].d-w[0].d;
              const dt=w[w.length-1].t-w[0].t;
              const p=calcPace(dd,dt);
              lastPaceRef.current=p;
              setCurrentPace(p);
            }
          }
        }
        // Eerste punt altijd toevoegen aan route
        if(!gpsReadyRef.current){
          gpsReadyRef.current=true;
          routeRef.current=[newP];
          setRoutePoints([newP]);
        }
        lastPosRef.current=newP;
      },{enableHighAccuracy:true,maximumAge:3000,timeout:30000},
      (err)=>{
        if(err.code===1)setGpsError("GPS geweigerd — ga naar browserinstellingen en geef locatietoestemming.");
        else if(err.code===2)setGpsError("GPS positie niet beschikbaar. Ga naar buiten of controleer je instellingen.");
        else setGpsError("GPS time-out. Probeer opnieuw.");
      });
    } else setGpsError("GPS niet ondersteund op dit apparaat.");
    // Timer — start altijd direct, onafhankelijk van GPS
    if(timerRef.current)clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      elapsedRef.current+=1;
      setElapsed(elapsedRef.current);
      setCalories(calcCal(distRef.current,elapsedRef.current));
      // Km alerts
      const km=Math.floor(distRef.current/1000);
      if(km>0&&!kmAlertsRef.current.includes(km)){
        kmAlertsRef.current=[...kmAlertsRef.current,km];
        setKmSplits(prev=>[...prev,{km,time:elapsedRef.current,pace:lastPaceRef.current}]);
        if(voiceKm){
          const p=lastPaceRef.current!=="–"?lastPaceRef.current:calcPace(distRef.current,elapsedRef.current);
          say(km+" kilometer. Tempo "+p+" per kilometer.");
        }
        // PR check
        const prDist=km===5?5000:km===10?10000:null;
        if(prDist&&distRef.current>=prDist){
          const oldPR=runPRs["k"+km];
          if(!oldPR||elapsedRef.current<oldPR.time){say("Nieuw PR op "+km+" kilometer!");}
        }
        // Doel bereikt
        const target=GOALS[selectedGoal].target;
        if(target>0&&distRef.current>=target){say("Gefeliciteerd! "+GOALS[selectedGoal].label+" klaar in "+fmtTime(elapsedRef.current)+"!");stopRun(true);}
      }
    },1000);
    // Interval timer
    if(runType==="interval"){
      setIntervalLeft(sprintSec);setIntervalPhase("sprint");setIntervalCount(0);
      intRef.current=setInterval(()=>{
        setIntervalLeft(l=>{
          if(l<=1){
            setIntervalPhase(ip=>{
              if(ip==="sprint"){say("Herstel.");setIntervalCount(c=>c+1);setIntervalLeft(restSec);return"recovery";}
              else{say("Sprint!");setIntervalLeft(sprintSec);return"sprint";}
            });return 0;
          }return l-1;
        });
      },1000);
    }
  }

  function pauseRun(){
    setIsRunning(false);
    clearInterval(timerRef.current);clearInterval(intRef.current);
    if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);
    say("Pauze.");
  }
  function resumeRun(){
    setIsRunning(true);
    say("Hervat.");
    if(navigator.geolocation){watchRef.current=navigator.geolocation.watchPosition(pos=>{const newP={lat:pos.coords.latitude,lon:pos.coords.longitude,t:Date.now()};if(lastPosRef.current){const d=haversine(lastPosRef.current,newP);if(d>1&&d<200){distRef.current+=d;setDist(distRef.current);routeRef.current=[...routeRef.current,newP];setRoutePoints([...routeRef.current]);}}lastPosRef.current=newP;},{enableHighAccuracy:true,maximumAge:1000});}
    timerRef.current=setInterval(()=>{elapsedRef.current+=1;setElapsed(elapsedRef.current);setCalories(calcCal(distRef.current,elapsedRef.current));},1000);
    if(runType==="interval"&&intRef.current===null){intRef.current=setInterval(()=>{setIntervalLeft(l=>{if(l<=1){setIntervalPhase(ip=>{if(ip==="sprint"){say("Herstel.");setIntervalCount(c=>c+1);setIntervalLeft(restSec);return"recovery";}else{say("Sprint!");setIntervalLeft(sprintSec);return"sprint";}});return 0;}return l-1;});},1000);}
  }
  function stopRun(finished=false){
    clearInterval(timerRef.current);clearInterval(intRef.current);
    if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);
    timerRef.current=null;intRef.current=null;
    setIsRunning(false);
    if(finished||distRef.current>100){setPhase("done");}
    else{setPhase("setup");}
  }
  useEffect(()=>()=>{clearInterval(timerRef.current);clearInterval(intRef.current);if(watchRef.current)navigator.geolocation.clearWatch(watchRef.current);},[]);

  function RouteKaart({points,height,live}){
    const H=height||200;
    if(points.length===0)return(
      <div style={{height:H,background:isDark?"#1a1a1a":"#E8E8E0",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:8,border:"1px solid "+(isDark?"#222":"#D0D0C8")}}>
        <div style={{fontSize:13,color:isDark?"#444":"#999",fontWeight:600}}>Wacht op GPS-signaal...</div>
      </div>
    );
    // Bereken bounding box
    const lats=points.map(p=>p.lat),lons=points.map(p=>p.lon);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats);
    const minLon=Math.min(...lons),maxLon=Math.max(...lons);
    const cLat=(minLat+maxLat)/2,cLon=(minLon+maxLon)/2;
    // SVG route tekenen
    const W=400,SH=H;
    const pad=0.0003;
    const scaleX=W/(maxLon-minLon+pad*2);
    const scaleY=SH/(maxLat-minLat+pad*2);
    const scale=Math.min(scaleX,scaleY)*0.85;
    const offX=(W-(maxLon-minLon)*scale)/2;
    const offY=(SH-(maxLat-minLat)*scale)/2;
    const toX=lon=>offX+(lon-minLon)*scale;
    const toY=lat=>SH-offY-(lat-minLat)*scale;
    const pathD=points.map((p,i)=>(i===0?"M":"L")+toX(p.lon).toFixed(1)+","+toY(p.lat).toFixed(1)).join(" ");
    const last=points[points.length-1];
    // OSM tile URL voor statische achtergrond (zoom 15)
    const zoom=15;
    const tileX=Math.floor((cLon+180)/360*Math.pow(2,zoom));
    const tileY=Math.floor((1-Math.log(Math.tan(cLat*Math.PI/180)+1/Math.cos(cLat*Math.PI/180))/Math.PI)/2*Math.pow(2,zoom));
    const tileUrl="https://tile.openstreetmap.org/"+zoom+"/"+tileX+"/"+tileY+".png";
    return(
      <div style={{height:H,borderRadius:12,overflow:"hidden",border:"1px solid "+(isDark?"#222":"#D0D0C8"),position:"relative",background:isDark?"#1a1a2e":"#e8f0e8"}}>
        <img src={tileUrl} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:isDark?0.5:0.7}}
          onError={e=>e.target.style.display="none"}/>
        <div style={{position:"absolute",inset:0,background:isDark?"rgba(0,0,0,0.3)":"rgba(255,255,255,0.15)"}}/>
        <svg viewBox={"0 0 "+W+" "+SH} style={{position:"absolute",inset:0,width:"100%",height:"100%"}}>
          {points.length>1&&<path d={pathD} fill="none" stroke="#C8F138" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" filter="url(#glow)"/>}
          <defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <circle cx={toX(points[0].lon)} cy={toY(points[0].lat)} r="6" fill="#60a5fa" stroke="#fff" strokeWidth="2"/>
          <circle cx={toX(last.lon)} cy={toY(last.lat)} r="8" fill="#C8F138" stroke="#fff" strokeWidth="2.5"/>
          <circle cx={toX(last.lon)} cy={toY(last.lat)} r="14" fill="none" stroke="#C8F138" strokeWidth="1.5" opacity="0.5"/>
        </svg>
        <div style={{position:"absolute",bottom:6,right:8,fontSize:8,color:isDark?"rgba(255,255,255,0.5)":"#555"}}>© OpenStreetMap</div>
      </div>
    );
  }

  if(phase==="done"){
    const hz=hartzone(calcPace(dist,elapsed));
    // Sla PRs op
    [5000,10000,21097,42195].forEach(target=>{
      const key=target===5000?"k5":target===10000?"k10":target===21097?"half":"marathon";
      if(dist>=target){
        const splitTime=kmSplits[Math.round(target/1000)-1]?.time;
        if(splitTime&&(!runPRs[key]||splitTime<runPRs[key].time)){
          const newPRs={...runPRs,[key]:{time:splitTime,date:TODAY_KEY,dist:target}};
          LS.set("fitcoach_run_prs",newPRs);
        }
      }
    });
    return(
      <div>
        <div style={{textAlign:"center",padding:"24px 0 16px"}}>
          <div style={{fontSize:11,letterSpacing:4,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:10}}>{runType==="wandel"?"Wandeling voltooid":"Run voltooid"}</div>
          <div style={{fontSize:72,fontWeight:900,letterSpacing:-4,color:LIME,lineHeight:1}}>{(dist/1000).toFixed(2)}</div>
          <div style={{fontSize:16,color:isDark?"#555":"#888",marginBottom:20}}>kilometer</div>
          <div style={{display:"flex",justifyContent:"center",gap:28,marginBottom:16}}>
            {[{l:"Tijd",v:fmtTime(elapsed)},{l:"Tempo",v:calcPace(dist,elapsed)+" /km"},{l:"Snelheid",v:calcSpeed(dist,elapsed)+" km/u"},{l:"Calorieën",v:calories+" kcal"}].map(s=>(
              <div key={s.l} style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:900,color:TEXT}}>{s.v}</div><div style={{fontSize:9,color:"#555",marginTop:2}}>{s.l}</div></div>
            ))}
          </div>
          <div style={{display:"inline-flex",padding:"6px 14px",borderRadius:99,background:hz.color+"22",border:"1px solid "+hz.color+"44",fontSize:11,fontWeight:700,color:hz.color,marginBottom:16}}>{hz.label}</div>
        </div>
        {routePoints.length>1&&(
          <div style={{marginBottom:16}}>
            <RouteKaart points={routePoints} height={260}/>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button onClick={()=>{
                const pts=routePoints;
                if(pts.length<2)return;
                const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lon);
                const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
                const pad=0.0003,W=800,H=500;
                const toX=lon=>((lon-minLon+pad)/(maxLon-minLon+pad*2))*W;
                const toY=lat=>H-((lat-minLat+pad)/(maxLat-minLat+pad*2))*H;
                const pathD=pts.map((p,i)=>(i===0?"M":"L")+toX(p.lon).toFixed(1)+","+toY(p.lat).toFixed(1)).join(" ");
                const last=pts[pts.length-1];
                const kmTxt=(dist/1000).toFixed(2)+" km";
                const statsTxt=fmtTime(elapsed)+" · "+calcPace(dist,elapsed)+" /km · "+calories+" kcal";
                const svgStr=
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+(H+120)+'">'
                  +'<rect width="'+W+'" height="'+(H+120)+'" fill="#0D0D0D"/>'
                  +'<path d="'+pathD+'" fill="none" stroke="#C8F138" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
                  +'<circle cx="'+toX(pts[0].lon).toFixed(1)+'" cy="'+toY(pts[0].lat).toFixed(1)+'" r="8" fill="#60a5fa"/>'
                  +'<circle cx="'+toX(last.lon).toFixed(1)+'" cy="'+toY(last.lat).toFixed(1)+'" r="10" fill="#C8F138" stroke="#0D0D0D" stroke-width="2"/>'
                  +'<text x="40" y="'+(H+52)+'" font-family="Arial" font-size="52" font-weight="900" fill="#C8F138">'+kmTxt+'</text>'
                  +'<text x="40" y="'+(H+88)+'" font-family="Arial" font-size="22" fill="#888">'+statsTxt+'</text>'
                  +'<text x="'+(W-30)+'" y="'+(H+108)+'" font-family="Arial" font-size="16" fill="#444" text-anchor="end">FitCoach Pro</text>'
                  +'</svg>';
                const blob=new Blob([svgStr],{type:"image/svg+xml"});
                const url=URL.createObjectURL(blob);
                const a=document.createElement("a");
                a.href=url;a.download="route.svg";
                document.body.appendChild(a);a.click();document.body.removeChild(a);
                setTimeout(()=>URL.revokeObjectURL(url),1000);
              }} style={{flex:1,padding:"11px",borderRadius:12,border:"1px solid rgba(200,241,56,0.3)",background:"rgba(200,241,56,0.06)",color:LIME,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                Download route
              </button>
              {navigator.share&&<button onClick={async()=>{
                try{
                  const type=runType==="wandel"?"gewandeld":"gelopen";
                  await navigator.share({title:"Mijn route — FitCoach Pro",text:"Zojuist "+(dist/1000).toFixed(2)+" km "+type+" in "+fmtTime(elapsed)+"! Tempo: "+calcPace(dist,elapsed)+" /km. 🔥 "+calories+" kcal verbrand. Via FitCoach Pro 💪"});
                }catch(e){}
              }} style={{flex:1,padding:"11px",borderRadius:12,border:"none",background:LIME,color:"#000",fontSize:13,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                Delen
              </button>}
            </div>
          </div>
        )}
        {kmSplits.length>0&&(
          <div style={{...S.card,padding:14,marginBottom:14}}>
            <div style={{fontSize:10,letterSpacing:3,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Km splits</div>
            {kmSplits.map((s,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:8,marginBottom:8,borderBottom:i<kmSplits.length-1?"1px solid "+(isDark?"#111":"#E8E8E0"):"none"}}>
                <div style={{fontSize:13,color:isDark?"#888":"#666",fontWeight:600}}>Km {s.km}</div>
                <div style={{display:"flex",gap:16}}>
                  <div style={{fontSize:12,color:isDark?"#666":"#888"}}>{s.pace||"–"} /km</div>
                  <div style={{fontSize:13,fontWeight:700,color:LIME}}>{fmtTime(i===0?s.time:s.time-kmSplits[i-1].time)}</div>
                </div>
              </div>
            ))}
          </div>
        )}
        <button onClick={()=>onDone({dist,time:elapsed,pace:calcPace(dist,elapsed),speed:calcSpeed(dist,elapsed),cal:calories,goal:selectedGoal,type:runType,splits:kmSplits,route:routePoints})} style={{width:"100%",padding:16,borderRadius:14,border:"none",cursor:"pointer",background:LIME,color:"#000",fontSize:15,fontWeight:900,marginBottom:8}}>Opslaan & klaar</button>
        <button onClick={()=>setPhase("setup")} style={{width:"100%",padding:12,borderRadius:14,border:"1px solid "+BORDER,background:"none",color:isDark?"#555":"#888",fontSize:13,cursor:"pointer"}}>Nieuwe run</button>
      </div>
    );
  }

  if(phase==="running"){
    const hz=hartzone(currentPace);
    const targetDist=GOALS[selectedGoal].target;
    const progPct=targetDist>0?Math.min(100,(dist/targetDist)*100):0;
    return(
      <div>
        <div style={{marginBottom:10}}>{gpsError?<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#ef4444",fontWeight:600}}>{gpsError}</div>:routePoints.length===0?<div style={{background:isDark?"rgba(200,241,56,0.05)":"rgba(200,241,56,0.08)",border:"1px solid rgba(200,241,56,0.2)",borderRadius:10,padding:"10px 14px",fontSize:12,color:LIME,display:"flex",alignItems:"center",gap:8}}><div style={{width:8,height:8,borderRadius:"50%",background:LIME,animation:"pulse 1s infinite",flexShrink:0}}/><span>GPS-signaal zoeken... Loop naar buiten voor beter signaal.</span></div>:null}</div>
        {targetDist>0&&(
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:isDark?"#444":"#888",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>
              <span>{GOALS[selectedGoal].label}</span><span>{(dist/1000).toFixed(2)} / {(targetDist/1000).toFixed(1)} km</span>
            </div>
            <div style={{background:isDark?"#111":"#E8E8E0",borderRadius:99,height:4,overflow:"hidden"}}>
              <div style={{width:progPct+"%",height:4,background:LIME,borderRadius:99,transition:"width 2s"}}/>
            </div>
          </div>
        )}
        <div style={{marginBottom:10}}><RouteKaart points={routePoints} height={180} live={true}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div style={{...S.card,padding:14,textAlign:"center"}}>
            <div style={{fontSize:9,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Afstand</div>
            <div style={{fontSize:32,fontWeight:900,color:LIME,letterSpacing:-1}}>{(dist/1000).toFixed(2)}</div>
            <div style={{fontSize:10,color:isDark?"#444":"#888"}}>km</div>
          </div>
          <div style={{...S.card,padding:14,textAlign:"center"}}>
            <div style={{fontSize:9,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Tijd</div>
            <div style={{fontSize:32,fontWeight:900,letterSpacing:-1}}>{fmtTime(elapsed)}</div>
          </div>
          <div style={{...S.card,padding:14,textAlign:"center"}}>
            <div style={{fontSize:9,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Tempo</div>
            <div style={{fontSize:28,fontWeight:900,color:hz.color,letterSpacing:-1}}>{currentPace}</div>
            <div style={{fontSize:9,color:isDark?"#444":"#888"}}>/km</div>
          </div>
          <div style={{...S.card,padding:14,textAlign:"center"}}>
            <div style={{fontSize:9,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Snelheid</div>
            <div style={{fontSize:28,fontWeight:900,letterSpacing:-1}}>{calcSpeed(dist,elapsed)}</div>
            <div style={{fontSize:9,color:isDark?"#444":"#888"}}>km/u</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div style={{...S.card,padding:10,display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:hz.color,flexShrink:0}}/>
            <div style={{fontSize:10,color:hz.color,fontWeight:700}}>{hz.label}</div>
          </div>
          <div style={{...S.card,padding:10,textAlign:"center"}}>
            <div style={{fontSize:10,color:isDark?"#444":"#888"}}>{calories} kcal verbrand</div>
          </div>
        </div>
        {runType==="interval"&&(
          <div style={{...S.card,padding:"12px 16px",marginBottom:10,border:"1px solid "+(intervalPhase==="sprint"?"rgba(255,107,43,0.3)":"rgba(200,241,56,0.2)"),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:9,letterSpacing:3,color:intervalPhase==="sprint"?ORANGE:LIME,fontWeight:700,textTransform:"uppercase",marginBottom:2}}>{intervalPhase==="sprint"?"Sprint":"Herstel"}</div>
              <div style={{fontSize:36,fontWeight:900,color:intervalPhase==="sprint"?ORANGE:LIME,letterSpacing:-2}}>{intervalLeft}<span style={{fontSize:12,color:isDark?"#444":"#888",marginLeft:2}}>s</span></div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:9,color:isDark?"#333":"#888",textTransform:"uppercase",letterSpacing:2}}>Interval</div>
              <div style={{fontSize:28,fontWeight:900}}>{intervalCount+1}</div>
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>isRunning?pauseRun():resumeRun()} style={{flex:1,padding:16,borderRadius:14,border:"none",cursor:"pointer",background:isRunning?isDark?"#1C1C1C":"#E8E8E0":LIME,color:isRunning?isDark?"#555":"#888":"#000",fontSize:14,fontWeight:900,letterSpacing:1}}>
            {isRunning?"⏸ "+(lang==="en"?"Pause":"Pauze"):"▶ Hervat"}
          </button>
          <button onClick={()=>{if(window.confirm(lang==="en"?"Stop run?":lang==="de"?"Lauf stoppen?":"Run stoppen?"))stopRun(true);}} style={{padding:"16px 20px",borderRadius:14,border:"1px solid rgba(239,68,68,0.3)",background:"none",color:"#ef4444",fontSize:13,fontWeight:700,cursor:"pointer"}}>⏹ Stop</button>
        </div>
      </div>
    );
  }

  // Sub-tabs
  const tabs=[{id:"start",l:"Start"},{id:"plannen",l:"Plannen"},{id:"geschiedenis",l:"Historie"},{id:"records",l:"PRs"}];
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:16}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setMainTab(t.id)} style={{padding:"11px 8px",borderRadius:10,border:"1px solid "+(mainTab===t.id?LIME:BORDER),cursor:"pointer",background:mainTab===t.id?"rgba(200,241,56,0.07)":isDark?"#111":CARD_BG,color:mainTab===t.id?LIME:isDark?"#555":"#888",fontSize:13,fontWeight:mainTab===t.id?800:500,textAlign:"center",transition:"all .15s",letterSpacing:-0.3}}>{t.l}</button>
        ))}
      </div>

      {mainTab==="start"&&(
        <div>
          {prevRun&&prevRun.dist>100&&(
            <div style={{...S.card,padding:"12px 16px",marginBottom:16,borderTop:"3px solid "+LIME}}>
              <div style={{fontSize:10,letterSpacing:2,color:LIME,fontWeight:700,textTransform:"uppercase",marginBottom:10}}>{lang==="en"?"Previous run":lang==="de"?"Vorheriger Lauf":"Vorige run"}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[{l:"Afstand",v:(prevRun.dist/1000).toFixed(2)+" km",c:LIME},{l:"Tijd",v:fmtTime(prevRun.time||0),c:TEXT},{l:"Tempo",v:(prevRun.pace||"–")+" /km",c:TEXT}].map(s=>(
                  <div key={s.l} style={{textAlign:"center"}}>
                    <div style={{fontSize:16,fontWeight:900,color:s.c,marginBottom:2}}>{s.v}</div>
                    <div style={{fontSize:9,color:isDark?"#444":"#888",textTransform:"uppercase",letterSpacing:1}}>{s.l}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Type training</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {RUN_TYPES.map(t=>{
              const fotoMap={steady:P.cardio,interval:P.hiit,tempo:P["full body"],wandel:P.buik};
              const foto=fotoMap[t.v]||P.cardio;
              return(
                <button key={t.v} onClick={()=>setRunType(t.v)} style={{height:100,borderRadius:14,border:"2px solid "+(runType===t.v?t.kleur:"transparent"),cursor:"pointer",overflow:"hidden",position:"relative",textAlign:"left"}}>
                  <img src={foto} alt={t.l} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
                  <div style={{position:"absolute",inset:0,background:runType===t.v?"rgba(0,0,0,0.45)":"linear-gradient(to bottom,transparent 10%,rgba(0,0,0,0.8))"}}/>
                  {runType===t.v&&<div style={{position:"absolute",top:8,right:8,width:18,height:18,borderRadius:"50%",background:t.kleur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#000",fontWeight:900}}>✓</div>}
                  <div style={{position:"relative",padding:"8px 10px",height:"100%",display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                    <div style={{fontSize:14,fontWeight:900,color:"#fff",marginBottom:2}}>{t.l}</div>
                    <div style={{fontSize:9,color:isDark?"rgba(255,255,255,0.7)":"#444"}}>{t.d}</div>
                  </div>
                </button>
              );
            })}
          </div>
          {runType==="wandel"&&(
            <div style={{...S.card,padding:"10px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:TEXT}}>Incline wandeling</div><div style={{fontSize:11,color:isDark?"#444":"#888"}}>Extra calorieverbranding, loopband helling</div></div>
              <div onClick={()=>setInclineMode(v=>!v)} style={{width:40,height:22,borderRadius:11,background:inclineMode?"rgba(96,165,250,0.2)":"#222",border:"1px solid "+(inclineMode?"#60a5fa":isDark?"#333":"#888"),position:"relative",cursor:"pointer",flexShrink:0}}>
                <div style={{width:16,height:16,borderRadius:"50%",background:inclineMode?"#60a5fa":isDark?"#444":"#888",position:"absolute",top:2,left:inclineMode?20:2,transition:"left .2s"}}/>
              </div>
            </div>
          )}
          <div style={{fontSize:11,letterSpacing:2,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Doel</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
            {Object.entries(GOALS).map(([k,g])=>(
              <button key={k} onClick={()=>setSelectedGoal(k)} style={{padding:"13px 14px",borderRadius:12,border:"1px solid "+(selectedGoal===k?LIME:BORDER),background:selectedGoal===k?"rgba(200,241,56,0.07)":isDark?"#111":CARD_BG,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:15,fontWeight:900,color:selectedGoal===k?LIME:TEXT,marginBottom:2}}>{g.label}</div>
                  <div style={{fontSize:10,color:isDark?"#444":"#888"}}>{g.sub}</div>
                </div>
                {selectedGoal===k&&<div style={{color:LIME,fontSize:16}}>✓</div>}
              </button>
            ))}
          </div>
          {runType==="interval"&&(
            <div style={{...S.card,padding:14,marginBottom:14}}>
              <div style={{fontSize:10,letterSpacing:3,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Interval instellingen</div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,color:isDark?"#888":"#666",marginBottom:6}}>Sprint duur</div>
                <div style={{display:"flex",gap:6}}>{[20,30,45,60,90].map(s=><button key={s} onClick={()=>setSprintSec(s)} style={{flex:1,padding:"8px 2px",borderRadius:8,border:"1px solid "+(sprintSec===s?ORANGE:BORDER),background:sprintSec===s?"rgba(255,107,43,0.08)":isDark?"#111":CARD_BG,color:sprintSec===s?ORANGE:isDark?"#444":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>{s}s</button>)}</div>
              </div>
              <div>
                <div style={{fontSize:11,color:isDark?"#888":"#666",marginBottom:6}}>Herstel duur</div>
                <div style={{display:"flex",gap:6}}>{[30,60,90,120,180].map(s=><button key={s} onClick={()=>setRestSec(s)} style={{flex:1,padding:"8px 2px",borderRadius:8,border:"1px solid "+(restSec===s?LIME:BORDER),background:restSec===s?"rgba(200,241,56,0.08)":isDark?"#111":CARD_BG,color:restSec===s?LIME:isDark?"#444":"#888",fontSize:11,fontWeight:700,cursor:"pointer"}}>{s<60?s+"s":Math.floor(s/60)+"m"}</button>)}</div>
              </div>
            </div>
          )}
          <div onClick={()=>setVoiceKm(v=>!v)} style={{...S.card,padding:"10px 14px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
            <div><div style={{fontSize:13,fontWeight:700,color:TEXT}}>Km-updates</div><div style={{fontSize:10,color:isDark?"#444":"#888"}}>Afstand en tempo per kilometer</div></div>
            <div style={{width:40,height:22,borderRadius:11,background:voiceKm?"rgba(200,241,56,0.2)":isDark?"#222":"#E0E0D8",border:"1px solid "+(voiceKm?LIME:isDark?"#333":"#888"),position:"relative"}}>
              <div style={{width:16,height:16,borderRadius:"50%",background:voiceKm?LIME:isDark?"#444":"#888",position:"absolute",top:2,left:voiceKm?20:2,transition:"left .2s"}}/>
            </div>
          </div>
          <button onClick={startRun} style={{width:"100%",padding:20,borderRadius:16,border:"none",cursor:"pointer",background:runType==="wandel"?"#60a5fa":LIME,color:"#000",fontSize:17,fontWeight:900,letterSpacing:-0.5,marginBottom:8}}>
            {runType==="wandel"?"Start wandeling":"Start run"}
          </button>
          <div style={{fontSize:10,color:isDark?"#333":"#999",textAlign:"center"}}>Vereist GPS-toestemming in je browser</div>
        </div>
      )}

      {mainTab==="plannen"&&(
        <div>
          {activePlan?(
            <div>
              {(()=>{
                const plan=LOOP_PLANNEN.find(p=>p.id===activePlan.id);
                if(!plan)return null;
                const week=plan.schema[activePlan.week-1];
                const voltooide=activePlan.voltooide||[];
                return(
                  <div>
                    <div style={{...S.card,padding:16,marginBottom:14,background:"rgba(200,241,56,0.04)",border:"1px solid rgba(200,241,56,0.15)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                        <div><div style={{fontSize:11,color:LIME,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>{plan.icon} {plan.label}</div><div style={{fontSize:18,fontWeight:900,color:TEXT}}>Week {activePlan.week} van {plan.weken}</div></div>
                        <button onClick={()=>{if(window.confirm(lang==="en"?"Stop plan?":lang==="de"?"Plan stoppen?":"Plan stoppen?"))setActivePlan(null);LS.set("fitcoach_run_plan",null);}} style={{padding:"4px 10px",borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"none",color:"#ef4444",fontSize:11,cursor:"pointer"}}>Stop plan</button>
                      </div>
                      <div style={{background:isDark?"#111":"#E8E8E0",borderRadius:99,height:4,overflow:"hidden",marginBottom:6}}>
                        <div style={{width:((activePlan.week-1)/plan.weken*100)+"%",height:4,background:LIME,borderRadius:99}}/>
                      </div>
                      <div style={{fontSize:10,color:isDark?"#444":"#888"}}>{Math.round((activePlan.week-1)/plan.weken*100)}% voltooid</div>
                    </div>
                    <div style={{fontSize:10,letterSpacing:3,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Week {activePlan.week} sessies</div>
                    {week.sessies.map((sessie,i)=>{
                      const done=voltooide.includes(activePlan.week+"-"+i);
                      return(
                        <div key={i} style={{...S.card,padding:14,marginBottom:8,border:"1px solid "+(done?"rgba(200,241,56,0.3)":BORDER),opacity:done?0.6:1}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <div>
                              <div style={{fontSize:13,fontWeight:700,color:done?LIME:TEXT,marginBottom:2}}>
                                {done?"✓ ":""}{sessie.type==="steady"?"Duurloop "+sessie.minuten+" min":sessie.type==="tempo"?"Tempoloop "+sessie.minuten+" min":sessie.type==="race"?"🏁 Wedstrijd/test — "+(sessie.doel/1000)+" km":"Intervaltraining"}
                              </div>
                              {sessie.blokken&&<div style={{fontSize:10,color:isDark?"#444":"#888"}}>{sessie.blokken[0].herh}× {sessie.blokken[0].werk}s werk / {sessie.blokken[0].rust}s rust</div>}
                            </div>
                            {!done&&(
                              <button onClick={()=>{
                                const newVoltooide=[...(activePlan.voltooide||[]),activePlan.week+"-"+i];
                                const allDone=week.sessies.every((_,j)=>newVoltooide.includes(activePlan.week+"-"+j));
                                const newPlan={...activePlan,voltooide:newVoltooide,week:allDone&&activePlan.week<plan.weken?activePlan.week+1:activePlan.week};
                                setActivePlan(newPlan);LS.set("fitcoach_run_plan",newPlan);
                                setRunType(sessie.type==="steady"||sessie.type==="race"?"steady":sessie.type==="interval"?"interval":"tempo");
                                if(sessie.doel)setSelectedGoal(sessie.doel===5000?"k5":sessie.doel===10000?"k10":sessie.doel===21097?"half":"marathon");
                                setMainTab("start");
                              }} style={{padding:"6px 12px",borderRadius:8,border:"none",background:LIME,color:"#000",fontSize:11,fontWeight:800,cursor:"pointer"}}>Start →</button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
          ):(
            <div>
              <div style={{fontSize:13,color:isDark?"#555":"#888",marginBottom:16,lineHeight:1.6}}>Kies een trainingsplan en Roan begeleidt je stap voor stap naar je doel.</div>
              {LOOP_PLANNEN.map(plan=>(
                <div key={plan.id} style={{...S.card,padding:16,marginBottom:10,border:"1px solid "+BORDER}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div>
                      <div style={{fontSize:11,color:LIME,fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>{plan.icon} {plan.weken} weken · {plan.doel}</div>
                      <div style={{fontSize:17,fontWeight:900,color:TEXT,marginBottom:4}}>{plan.label}</div>
                      <div style={{fontSize:12,color:isDark?"#555":"#888",lineHeight:1.5}}>{plan.beschrijving}</div>
                    </div>
                  </div>
                  <button onClick={()=>{const p={id:plan.id,week:1,voltooide:[],startDatum:TODAY_KEY};setActivePlan(p);LS.set("fitcoach_run_plan",p);}} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:LIME,color:"#000",fontSize:12,fontWeight:800,cursor:"pointer",marginTop:8}}>Start plan</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {mainTab==="geschiedenis"&&(
        <div>
          {runHistory.length===0?(
            <div style={{...S.card,padding:24,textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:8}}></div>
              <div style={{fontSize:14,fontWeight:700,color:TEXT,marginBottom:4}}>Nog geen runs</div>
              <div style={{fontSize:12,color:isDark?"#555":"#888"}}>Start je eerste run om je geschiedenis bij te houden</div>
            </div>
          ):(
            <div>
              {(()=>{
                const weekKm=runHistory.filter(r=>{try{const d=parseDate(r.date);return(TODAY-d)/86400000<7;}catch{return false;}}).reduce((s,r)=>s+(r.runDist||0),0)/1000;
                const maandKm=runHistory.filter(r=>{try{const d=parseDate(r.date);return(TODAY-d)/86400000<30;}catch{return false;}}).reduce((s,r)=>s+(r.runDist||0),0)/1000;
                return(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                    <div style={{...S.card,padding:14,textAlign:"center"}}><div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Deze week</div><div style={{fontSize:28,fontWeight:900,color:LIME}}>{weekKm.toFixed(1)}</div><div style={{fontSize:10,color:"#555"}}>km</div></div>
                    <div style={{...S.card,padding:14,textAlign:"center"}}><div style={{fontSize:11,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Deze maand</div><div style={{fontSize:28,fontWeight:900,color:TEXT}}>{maandKm.toFixed(1)}</div><div style={{fontSize:10,color:"#555"}}>km</div></div>
                  </div>
                );
              })()}
              {runHistory.slice(0,15).map((r,i)=>(
                <div key={i} style={{...S.card,padding:14,marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontSize:11,color:isDark?"#444":"#888"}}>{r.date} · {r.runType||"Run"}</div>
                    {r.runCal&&<div style={{fontSize:10,color:ORANGE}}>{r.runCal} kcal</div>}
                  </div>
                  <div style={{display:"flex",gap:20}}>
                    <div><div style={{fontSize:22,fontWeight:900,color:LIME}}>{((r.runDist||0)/1000).toFixed(2)}<span style={{fontSize:10,color:isDark?"#444":"#888",marginLeft:1}}>km</span></div></div>
                    <div><div style={{fontSize:18,fontWeight:700}}>{fmtTime(r.runTime||0)}</div><div style={{fontSize:9,color:"#555"}}>tijd</div></div>
                    <div><div style={{fontSize:18,fontWeight:700}}>{r.runPace||"–"}</div><div style={{fontSize:9,color:"#555"}}>/km</div></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {mainTab==="records"&&(
        <div>
          <div style={{fontSize:12,color:isDark?"#555":"#888",marginBottom:16}}>Jouw beste tijden per afstand</div>
          {[{key:"k5",label:"5 km",dist:5000,icon:""},{key:"k10",label:"10 km",dist:10000,icon:""},{key:"half",label:"Halve marathon",dist:21097,icon:""},{key:"marathon",label:"Marathon",dist:42195,icon:""}].map(({key,label,dist:d,icon})=>{
            const pr=runPRs[key];
            return(
              <div key={key} style={{...S.card,padding:16,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:36,height:36,borderRadius:10,background:isDark?"#1C1C1C":"#E8E8E0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:LIME}}>{label.split(" ")[0]}</div>
                    <div>
                      <div style={{fontSize:14,fontWeight:800,color:TEXT}}>{label}</div>
                      {pr&&<div style={{fontSize:10,color:isDark?"#444":"#888",marginTop:2}}>{pr.date}</div>}
                    </div>
                  </div>
                  {pr?(
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:24,fontWeight:900,color:LIME}}>{fmtTime(pr.time)}</div>
                      <div style={{fontSize:10,color:isDark?"#444":"#888"}}>{calcPace(d,pr.time)} /km</div>
                    </div>
                  ):(
                    <div style={{fontSize:12,color:isDark?"#333":"#999",fontStyle:"italic"}}>Nog geen PR</div>
                  )}
                </div>
              </div>
            );
          })}
          <div style={{...S.card,padding:14,marginTop:8}}>
            <div style={{fontSize:10,letterSpacing:3,color:isDark?"#444":"#888",fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Totale statistieken</div>
            {(()=>{
              const totalKm=runHistory.reduce((s,r)=>s+(r.runDist||0),0)/1000;
              const totalRuns=runHistory.length;
              const totalCal=runHistory.reduce((s,r)=>s+(r.runCal||0),0);
              const longestRun=runHistory.reduce((max,r)=>Math.max(max,r.runDist||0),0)/1000;
              return(
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
